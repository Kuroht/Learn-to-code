<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C do Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Caderno de laboratório: papel azulado, tinta azul-escura, marcador amarelo na linha que está a correr.
     Layout: barra lateral com as lições + coluna de leitura; o visualizador alarga para código | memória + ecrã. */
  --paper: #f2f4f8;
  --panel: #ffffff;
  --ink: #161d2e;
  --muted: #586276;
  --line: #d9dfea;
  --accent: #2547d0;
  --accent-ink: #ffffff;
  --accent-soft: #e6ebfc;
  --mark: #ffe58a;
  --mark-edge: #d9a514;
  --ok: #17804a;
  --ok-soft: #e1f3e8;
  --bad: #bf3329;
  --bad-soft: #fbe6e3;
  --code-bg: #f8f9fc;
  --term-bg: #121826;
  --term-ink: #dfe6f3;
  --term-in: #ffd866;
  --t-kw: #7a2bc2;
  --t-ty: #0b7584;
  --t-str: #a0450a;
  --t-num: #ad1767;
  --t-com: #737d90;
  --t-pp: #39691a;
  --t-fn: #2547d0;
  --shadow: 0 1px 2px rgba(22, 29, 46, .06), 0 6px 20px rgba(22, 29, 46, .05);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f121a;
    --panel: #161b25;
    --ink: #e6e9f1;
    --muted: #98a1b4;
    --line: #283041;
    --accent: #8ea5ff;
    --accent-ink: #0f121a;
    --accent-soft: #1d2645;
    --mark: rgba(255, 210, 60, .2);
    --mark-edge: #e9bd3a;
    --ok: #4cc47f;
    --ok-soft: rgba(76, 196, 127, .14);
    --bad: #ff7d70;
    --bad-soft: rgba(255, 125, 112, .14);
    --code-bg: #121620;
    --term-bg: #0a0d14;
    --t-kw: #c79bf2;
    --t-ty: #63d3e2;
    --t-str: #f4a46d;
    --t-num: #ff8cc4;
    --t-com: #7e899f;
    --t-pp: #a8d873;
    --t-fn: #8ea5ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f121a;
  --panel: #161b25;
  --ink: #e6e9f1;
  --muted: #98a1b4;
  --line: #283041;
  --accent: #8ea5ff;
  --accent-ink: #0f121a;
  --accent-soft: #1d2645;
  --mark: rgba(255, 210, 60, .2);
  --mark-edge: #e9bd3a;
  --ok: #4cc47f;
  --ok-soft: rgba(76, 196, 127, .14);
  --bad: #ff7d70;
  --bad-soft: rgba(255, 125, 112, .14);
  --code-bg: #121620;
  --term-bg: #0a0d14;
  --t-kw: #c79bf2;
  --t-ty: #63d3e2;
  --t-str: #f4a46d;
  --t-num: #ff8cc4;
  --t-com: #7e899f;
  --t-pp: #a8d873;
  --t-fn: #8ea5ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.6 var(--font-body);
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 1.5rem + 2vw, 2.9rem); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.15rem; font-weight: 600; }
h4 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
code, pre, kbd { font-family: var(--font-mono); font-size: .88em; }
:not(pre) > code {
  background: var(--accent-soft);
  padding: .08em .35em;
  border-radius: 5px;
  white-space: nowrap;
}

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 276px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 22px 14px 28px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 10px; text-decoration: none; color: var(--ink); }
.brand-mark {
  font-family: var(--font-mono); font-weight: 600; font-size: .95rem;
  background: var(--ink); color: var(--panel); padding: 2px 7px; border-radius: 6px;
}
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -.01em; }
.progress { padding: 0 10px; display: grid; gap: 6px; font-size: .85rem; color: var(--muted); }
.progress-track { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.nav { display: grid; gap: 2px; }
.nav-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
.nav a {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .95rem; line-height: 1.3;
}
.nav a:hover { background: var(--paper); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-num {
  font-family: var(--font-mono); font-size: .78rem; color: var(--muted); text-align: center;
  border: 1px solid var(--line); border-radius: 6px; padding: 1px 0;
}
.nav a[aria-current="page"] .nav-num { border-color: var(--accent); color: var(--accent); }
.nav-done { color: var(--ok); font-size: .85rem; font-weight: 700; }
.nav-icon { width: 26px; text-align: center; color: var(--muted); font-family: var(--font-mono); font-size: .8rem; }

main { padding: 36px clamp(16px, 4vw, 52px) 96px; min-width: 0; }
.content { max-width: 1060px; margin: 0 auto; display: grid; gap: 40px; }
.prose { max-width: 68ch; display: grid; gap: 14px; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

.topbar { display: none; }

/* ---------- tabelas ---------- */
.t-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: .93rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.t th, .t td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--code-bg); }
.t tr:last-child td { border-bottom: 0; }
.t td code { white-space: nowrap; }

/* ---------- código ---------- */
pre { margin: 0; }
pre.snip {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; overflow-x: auto; line-height: 1.55;
}
.t-kw { color: var(--t-kw); font-weight: 600; }
.t-ty { color: var(--t-ty); font-weight: 600; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-pp { color: var(--t-pp); }
.t-fn { color: var(--t-fn); }

/* ---------- cabeçalho da lição ---------- */
.lesson-head { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: .82rem; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 60ch; }
.analogy {
  max-width: 68ch; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--mark-edge);
  border-radius: 10px; padding: 14px 18px; display: grid; gap: 4px;
}
.analogy-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.section { display: grid; gap: 16px; }
.section-head { display: grid; gap: 4px; }
.section-head p { color: var(--muted); }

/* ---------- visualizador ---------- */
.viz {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 16px; display: grid; gap: 12px;
}
.viz:focus-visible { outline-offset: 4px; border-radius: 14px; }
.viz-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.viz-title { display: grid; gap: 2px; }
.viz-title small { font-family: var(--font-mono); color: var(--muted); font-size: .78rem; }
.viz-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.viz-count { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); min-width: 9.5em; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn {
  font: inherit; font-size: .92rem; font-weight: 700; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 7px 14px; border-radius: 9px; line-height: 1.2;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.08); }
.btn-ghost { border-color: transparent; color: var(--muted); }
.viz-bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.viz-bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.viz-note {
  background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; min-height: 3.4em;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start;
}
.viz-note code { background: var(--panel); }
.viz-note-line { font-family: var(--font-mono); font-size: .78rem; font-weight: 600; color: var(--accent); background: var(--panel); border-radius: 6px; padding: 2px 7px; margin-top: 2px; white-space: nowrap; }
.viz-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.viz-side { display: grid; gap: 12px; }
.panel { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.panel-label {
  font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
  padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; justify-content: space-between; gap: 8px;
}
.code { overflow-x: auto; padding: 8px 0; font-family: var(--font-mono); font-size: .86rem; line-height: 1.65; }
.ln { display: grid; grid-template-columns: 2.6em 1.3em minmax(0, 1fr); white-space: pre; min-width: max-content; padding-right: 14px; }
.ln .no { text-align: right; color: var(--t-com); opacity: .8; user-select: none; }
.ln .arrow { text-align: center; color: var(--mark-edge); user-select: none; }
.ln.cur { background: var(--mark); box-shadow: inset 3px 0 0 var(--mark-edge); }
.ln.cur .no { color: var(--ink); opacity: 1; font-weight: 600; }

.mem { padding: 10px; display: grid; gap: 10px; min-height: 92px; }
.mem-empty { color: var(--muted); font-size: .9rem; padding: 6px 4px; }
.frame { border: 1px dashed var(--line); border-radius: 9px; padding: 8px; display: grid; gap: 8px; background: var(--panel); }
.frame.active { border: 1px solid var(--accent); }
.frame-name { font-family: var(--font-mono); font-size: .78rem; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
.frame.active .frame-name { color: var(--accent); }
.vars { display: flex; flex-wrap: wrap; gap: 8px; }
.var {
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px 7px; background: var(--code-bg);
  display: grid; gap: 2px; min-width: 76px; max-width: 100%;
}
.var.wide { flex-basis: 100%; }
.var-top { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-mono); font-size: .7rem; color: var(--muted); }
.var-type { color: var(--t-ty); }
.var-name { font-family: var(--font-mono); font-weight: 600; font-size: .9rem; }
.var-val { font-family: var(--font-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; border-radius: 5px; padding: 0 3px; margin: 0 -3px; overflow-wrap: anywhere; }
.chg { background: var(--mark); box-shadow: 0 0 0 2px var(--mark-edge); }
.var.is-new { border-color: var(--accent); }
.garbage { color: var(--muted); font-style: italic; }
.ptr-addr { color: var(--t-num); }
.ptr-arrow { color: var(--accent); font-size: .9rem; font-weight: 600; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.cell { display: grid; text-align: center; min-width: 2.7em; }
.cell-v { font-family: var(--font-mono); font-size: .92rem; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 2px 4px; }
.cell-i { font-family: var(--font-mono); font-size: .66rem; color: var(--muted); }
.fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-family: var(--font-mono); font-size: .88rem; margin-top: 2px; }
.fields .f-name { color: var(--muted); }
.mini { border-collapse: collapse; font-family: var(--font-mono); font-size: .84rem; margin-top: 4px; }
.mini th, .mini td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; }
.mini th { font-weight: 600; color: var(--muted); font-size: .72rem; background: var(--panel); }
.addr-note { font-size: .74rem; color: var(--muted); }

.term {
  background: var(--term-bg); color: var(--term-ink); font-family: var(--font-mono); font-size: .86rem;
  line-height: 1.6; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 4.8em; max-height: 15em; overflow-y: auto;
}
.term .in { color: var(--term-in); font-weight: 600; }
.term .enter { color: var(--term-in); opacity: .55; font-size: .8em; margin-left: 2px; }
.term .caret { display: inline-block; width: .55em; height: 1.05em; background: var(--term-ink); opacity: .55; vertical-align: text-bottom; }
.term .ph { color: #7e899f; font-style: italic; }
.panel.out { background: var(--term-bg); border-color: var(--term-bg); }
.panel.out .panel-label { background: var(--term-bg); color: #9aa6bd; border-color: #263046; }

/* ---------- erros comuns ---------- */
.mistakes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 76ch; }
.mistakes li { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 9px; padding: 10px 14px; }

/* ---------- quiz ---------- */
.quiz { display: grid; gap: 14px; }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.q-text { font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
.q-num { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.opt {
  font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start;
  border: 1px solid var(--line); background: var(--code-bg); color: var(--ink); border-radius: 9px; padding: 9px 12px;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt-key { font-family: var(--font-mono); font-size: .78rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; margin-top: 2px; background: var(--panel); }
.opt-txt.mono { font-family: var(--font-mono); font-size: .9rem; white-space: pre; overflow-x: auto; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .opt-key { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .opt-key { border-color: var(--bad); color: var(--bad); }
.opt.dim { opacity: .55; }
.q-exp { border-radius: 9px; padding: 10px 14px; background: var(--code-bg); border: 1px solid var(--line); }
.q-exp strong.ok { color: var(--ok); }
.q-exp strong.bad { color: var(--bad); }
.score {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
}
.score-num { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }

/* ---------- exercícios ---------- */
.exs { display: grid; gap: 14px; }
.ex { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.ex-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 4px; }
.ex .term { border-radius: 9px; max-height: none; min-height: 0; }
details { border: 1px solid var(--line); border-radius: 9px; background: var(--code-bg); }
summary { cursor: pointer; padding: 9px 14px; font-weight: 700; color: var(--accent); }
details[open] summary { border-bottom: 1px solid var(--line); }
.det-body { padding: 12px 14px; display: grid; gap: 10px; }
.det-body pre.snip { background: var(--panel); }
.sol-tools { display: flex; justify-content: flex-end; }

/* ---------- navegação entre lições ---------- */
.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 24px; }
.pager a {
  display: grid; gap: 2px; text-decoration: none; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 220px;
}
.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--muted); font-size: .8rem; }
.pager .next { text-align: right; margin-left: auto; }

/* ---------- início ---------- */
.hero { display: grid; gap: 16px; padding-top: 8px; }
.hero p { font-size: 1.15rem; color: var(--muted); max-width: 58ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.hero-actions .btn { padding: 10px 18px; font-size: 1rem; text-decoration: none; display: inline-block; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; counter-reset: s; }
.steps li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; counter-increment: s; align-content: start; }
.steps li::before { content: counter(s); font-family: var(--font-mono); font-weight: 600; font-size: .8rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; width: 1.8em; text-align: center; }
.steps p { color: var(--muted); font-size: .95rem; }
.grid-lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card-lesson {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; text-decoration: none; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; align-content: start;
}
.card-lesson:hover { border-color: var(--accent); }
.card-lesson .nav-num { grid-row: span 2; width: 28px; height: 24px; line-height: 20px; }
.card-lesson strong { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; line-height: 1.25; }
.card-lesson span.s { color: var(--muted); font-size: .88rem; line-height: 1.35; }
.card-lesson .done-tag { grid-column: 2; font-size: .78rem; font-weight: 700; color: var(--ok); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; }
.box ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.trace td, .trace th { font-family: var(--font-mono); font-size: .84rem; text-align: center; }
.trace td:last-child, .trace th:last-child { text-align: left; }
.trace tr.hl td { background: var(--mark); }

/* ---------- cábula ---------- */

<script>
// ===== Motor do visualizador: transforma a lista de passos de um exemplo em fotografias da memória. =====
// É partilhado por todos os cursos e corre tanto na página como nos testes (shared/check.js).
function parseVarPath(key) {
  const m = key.match(/^([A-Za-z_]\w*)(.*)$/);
  if (!m) throw new Error('caminho inválido: ' + key);
  const path = [];
  const re = /\[(\d+)\]|\.([A-Za-z_]\w*)/g;
  let t;
  let consumed = 0;
  while ((t = re.exec(m[2]))) {
    path.push(t[1] !== undefined ? Number(t[1]) : t[2]);
    consumed += t[0].length;
  }
  if (consumed !== m[2].length) throw new Error('caminho inválido: ' + key);
  return { name: m[1], path };
}

// ---------- tabelas (cursos de SQL) ----------
// Uma coluna escreve-se como no CREATE TABLE: ['numero', 'INTEGER PRIMARY KEY'] ou ['curso', 'INTEGER REFERENCES cursos(id)'].
function parseColumn(spec) {
  const [name, def] = spec;
  const fk = /REFERENCES\s+(\w+)\s*\((\w+)\)/i.exec(def);
  return {
    name,
    def,
    type: def.split(/\s+/)[0].toUpperCase(),
    pk: /PRIMARY\s+KEY/i.test(def),
    fk: fk ? fk[1] + '.' + fk[2] : null,
  };
}

// Transforma { cols, key?, rows? } numa tabela do motor. Cada linha leva um id interno,
// para o visualizador saber que linha é qual mesmo depois de outras serem apagadas.
function makeTable(spec, nextId) {
  const cols = spec.cols.map(parseColumn);
  (spec.key || []).forEach(k => {
    const col = cols.find(c => c.name === k);
    if (!col) throw new Error('chave com coluna inexistente: ' + k);
    col.pk = true;
  });
  const table = { cols, rows: [] };
  (spec.rows || []).forEach(cells => addRow(table, cells, nextId));
  return table;
}

function addRow(table, cells, nextId) {
  if (cells.length !== table.cols.length) throw new Error('linha com ' + cells.length + ' valores numa tabela com ' + table.cols.length + ' colunas');
  table.rows.push({ id: nextId(), cells: cells.slice() });
}

// Aplica as operações de tabelas de um passo: create, ins, upd, del, drop.
function applyTableOps(tables, s, where, nextId) {
  const find = name => {
    if (!tables[name]) throw new Error('tabela inexistente: ' + name + where);
    return tables[name];
  };
  if (s.create) {
    for (const [name, spec] of Object.entries(s.create)) {
      if (tables[name]) throw new Error('tabela repetida: ' + name + where);
      tables[name] = makeTable(spec, nextId);
    }
  }
  if (s.ins) {
    for (const [name, rows] of Object.entries(s.ins)) rows.forEach(cells => addRow(find(name), cells, nextId));
  }
  if (s.upd) {
    for (const [name, changes] of Object.entries(s.upd)) {
      const t = find(name);
      for (const [index, sets] of Object.entries(changes)) {
        const row = t.rows[Number(index)];
        if (!row) throw new Error('linha inexistente: ' + name + '[' + index + ']' + where);
        for (const [col, value] of Object.entries(sets)) {
          const c = t.cols.findIndex(x => x.name === col);
          if (c < 0) throw new Error('coluna inexistente: ' + name + '.' + col + where);
          row.cells[c] = value;
        }
      }
    }
  }
  if (s.del) {
    for (const [name, indexes] of Object.entries(s.del)) {
      const t = find(name);
      indexes.forEach(i => { if (!t.rows[i]) throw new Error('apagar linha inexistente: ' + name + '[' + i + ']' + where); });
      t.rows = t.rows.filter((_, i) => !indexes.includes(i));
    }
  }
  if (s.drop) s.drop.forEach(name => { find(name); delete tables[name]; });
  // tm: marcas que só valem neste passo, por exemplo as linhas que o WHERE de um UPDATE encontrou.
  if (s.tm) {
    for (const [name, marks] of Object.entries(s.tm)) {
      const t = find(name);
      Object.keys(marks).forEach(i => { if (!t.rows[i]) throw new Error('marca em linha inexistente: ' + name + '[' + i + ']' + where); });
    }
  }
}

// g: a grelha de trabalho de uma consulta (o que o FROM, o WHERE, o GROUP BY... já construíram).
function checkGrid(g, where) {
  if (g === null) return;
  if (!Array.isArray(g.cols) || !Array.isArray(g.rows)) throw new Error('grelha sem cols ou rows' + where);
  g.rows.forEach(r => { if (r.length !== g.cols.length) throw new Error('linha da grelha com ' + r.length + ' valores e ' + g.cols.length + ' colunas' + where); });
  if (g.marks && g.marks.length !== g.rows.length) throw new Error('marks da grelha com tamanho diferente das linhas' + where);
  if (g.groups && g.groups.reduce((a, b) => a + b, 0) !== g.rows.length) throw new Error('groups da grelha não somam o número de linhas' + where);
}

// ---------- referências e objetos (cursos de Python, C#, ...) ----------
// Um valor que começa por @ é uma referência para um objeto do heap: '@o1'.
const isRef = v => typeof v === 'string' && v.charAt(0) === '@';

// Todas as referências que um valor contém (o próprio valor, os elementos de uma lista, os campos de um objeto).
function refsIn(value) {
  if (isRef(value)) return [value.slice(1)];
  if (Array.isArray(value)) return value.flatMap(refsIn);
  if (value && typeof value === 'object') return Object.values(value).flatMap(refsIn);
  return [];
}

// Os objetos a que já ninguém chega, partindo dos nomes de todos os frames.
function unreachable(frames, heap) {
  const seen = new Set();
  const visit = id => {
    if (seen.has(id) || !heap[id]) return;
    seen.add(id);
    refsIn(heap[id].value).forEach(visit);
  };
  frames.forEach(f => f.vars.forEach(v => refsIn(v.value).forEach(visit)));
  return Object.keys(heap).filter(id => !seen.has(id));
}

// initialTables: a base de dados com que o exemplo começa ({ nome: { cols, rows } }), ou nada.
function buildSteps(raw, initialTables) {
  let frames = [];
  let out = '';
  let lastId = 0;
  const nextId = () => ++lastId;
  let tables = {};
  for (const [name, spec] of Object.entries(initialTables || {})) tables[name] = makeTable(spec, nextId);
  let grid = null;
  // heap: os objetos ({ id: { type, value } }). Um objeto sem nomes aparece desbotado num passo e desaparece no seguinte.
  let heap = {};
  let orphans = [];
  const res = [];
  raw.forEach((s, idx) => {
    frames = JSON.parse(JSON.stringify(frames));
    tables = JSON.parse(JSON.stringify(tables));
    heap = JSON.parse(JSON.stringify(heap));
    orphans.forEach(id => { delete heap[id]; });
    const where = ' (passo ' + (idx + 1) + ')';
    applyTableOps(tables, s, where, nextId);
    // obj: cria ou muda objetos: { o1: ['list', ['@o2', 3]] }
    if (s.obj) {
      for (const [id, spec] of Object.entries(s.obj)) heap[id] = { type: spec[0], value: JSON.parse(JSON.stringify(spec[1])) };
    }
    if (s.g !== undefined) {
      checkGrid(s.g, where);
      grid = JSON.parse(JSON.stringify(s.g));
    }
    const findFrame = name => {
      for (let i = frames.length - 1; i >= 0; i--) if (frames[i].name === name) return frames[i];
      throw new Error('frame inexistente: ' + name + where);
    };
    if (s.pop) {
      if (!frames.length) throw new Error('pop sem frames' + where);
      frames.pop();
    }
    if (s.push) frames.push({ name: s.push, vars: [] });
    if (s.x) {
      for (const [fn, names] of Object.entries(s.x)) {
        const f = findFrame(fn);
        names.forEach(n => {
          if (!f.vars.some(v => v.name === n)) throw new Error('apagar variável inexistente: ' + n + where);
        });
        f.vars = f.vars.filter(v => !names.includes(v.name));
      }
    }
    if (s.d) {
      for (const [fn, vars] of Object.entries(s.d)) {
        const f = findFrame(fn);
        for (const [name, spec] of Object.entries(vars)) {
          if (f.vars.some(v => v.name === name)) throw new Error('variável repetida: ' + name + where);
          const [type, value, addr] = spec;
          f.vars.push({ name, type, value: JSON.parse(JSON.stringify(value)), addr: addr || null });
        }
      }
    }
    if (s.u) {
      for (const [fn, sets] of Object.entries(s.u)) {
        const f = findFrame(fn);
        for (const [key, value] of Object.entries(sets)) {
          const { name, path } = parseVarPath(key);
          const v = f.vars.find(x => x.name === name);
          if (!v) throw new Error('atualizar variável inexistente: ' + name + where);
          if (!path.length) { v.value = value; continue; }
          let target = v.value;
          for (let i = 0; i < path.length - 1; i++) {
            target = target[path[i]];
            if (target === undefined) throw new Error('caminho inexistente: ' + key + where);
          }
          const last = path[path.length - 1];
          if (target[last] === undefined) throw new Error('caminho inexistente: ' + key + where);
          target[last] = value;
        }
      }
    }
    if (s.o) out += s.o;
    // Todas as referências têm de apontar para objetos que existem.
    const allValues = frames.flatMap(f => f.vars.map(v => v.value)).concat(Object.values(heap).map(o => o.value));
    allValues.flatMap(refsIn).forEach(id => { if (!heap[id]) throw new Error('referência para um objeto inexistente: @' + id + where); });
    orphans = unreachable(frames, heap);
    res.push({ l: s.l, frames, out, n: s.n || '', tables, tmarks: s.tm || {}, grid, err: s.err || '', heap, orphans });
  });
  return res;
}

if (typeof module !== 'undefined') module.exports = { buildSteps, parseVarPath, makeTable };

<li><strong><code>%</code> é o resto da divisão inteira.</strong> <code>7 % 2</code> dá <code>1</code>, porque 7 = 2 × 3 + 1. Serve para saber se um número é par (<code>n % 2 == 0</code>) ou para tirar o último algarismo (<code>n % 10</code>).</li>
</ul>
<p>A ordem das operações é a da matemática: <code>*</code> <code>/</code> <code>%</code> primeiro, depois <code>+</code> <code>-</code>. Em caso de dúvida, usa parênteses.</p>
<p>Atalhos: <code>x++</code> é <code>x = x + 1</code>; <code>x--</code> é <code>x = x - 1</code>; <code>x += 3</code> é <code>x = x + 3</code> (e há também <code>-=</code>, <code>*=</code>, <code>/=</code>).</p>`,

<p>O <code>if</code> executa um bloco só se a condição for verdadeira. O <code>else</code> é o "senão". Com <code>else if</code> encadeias vários testes, e só <strong>um</strong> dos blocos é executado: o primeiro cuja condição seja verdadeira.</p>
<table class="t">
<thead><tr><th>Comparar</th><th>Significa</th><th>Combinar</th><th>Significa</th></tr></thead>
<tbody>
<tr><td><code>==</code></td><td>igual</td><td><code>&amp;&amp;</code></td><td>e (as duas verdadeiras)</td></tr>
<tr><td><code>!=</code></td><td>diferente</td><td><code>||</code></td><td>ou (pelo menos uma)</td></tr>
<tr><td><code>&lt;</code> <code>&gt;</code></td><td>menor, maior</td><td><code>!</code></td><td>não (inverte)</td></tr>
<tr><td><code>&lt;=</code> <code>&gt;=</code></td><td>menor ou igual, maior ou igual</td><td></td><td></td></tr>
</tbody>
</table>
<p>Em C, <strong>0 é falso e qualquer outro número é verdadeiro</strong>. É por isso que <code>if (x = 5)</code> (com um só <code>=</code>) é sempre verdadeiro: guarda 5 em x e o resultado é 5, que não é zero.</p>

<p>Em C não existe um tipo "texto". Uma <strong>string</strong> é um array de <code>char</code> que acaba com um carácter especial, o <code>'\0'</code>, que marca o fim. A palavra <code>"Ana"</code> ocupa <strong>4</strong> caixas: <code>'A'</code>, <code>'n'</code>, <code>'a'</code> e <code>'\0'</code>.</p>

#include <stdio.h>

void minmax(int v[], int n, int *min, int *max) {
    *min = v[0];
    *max = v[0];
    for (int i = 1; i < n; i++) {
        if (v[i] < *min) {
            *min = v[i];
        }
        if (v[i] > *max) {
            *max = v[i];
        }
    }
}

int main(void) {
    int v[4] = {7, 2, 9, 4};
    int mn, mx;

}`,

  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- progresso (só neste browser) ----------
  const STORE = COURSE.storageKey;
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { progress = {}; }
  const saveProgress = () => { try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) { /* sem armazenamento */ } };
  const isDone = id => !!progress[id];

  // ---------- realce de sintaxe ----------
  // Cada curso define SYNTAX: uma regex com um grupo por tipo de token e a classe CSS de cada grupo.
  const TOK = SYNTAX.re;
  function hlLine(line) {
    let out = '';
    let last = 0;
    let m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(line))) {
      if (!m[0].length) { TOK.lastIndex++; continue; }
      out += esc(line.slice(last, m.index));
      const group = m.findIndex((g, i) => i > 0 && g !== undefined);
      const cls = SYNTAX.classes[group - 1];
      out += '<span class="t-' + cls + '">' + esc(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    return out + esc(line.slice(last));
  }
  const hlBlock = code => code.split('\n').map(hlLine).join('\n');
  function highlightStatic(root) {
    $$('pre.snip code', root).forEach(el => {
      if (el.dataset.hl) return;
      el.innerHTML = hlBlock(el.textContent);
      el.dataset.hl = '1';
    });
  }

  // ---------- ecrã (terminal) ----------
  function renderTerm(s, withCaret) {
    if (!s) return '<span class="ph">(ainda nada no ecrã)</span>';
    const html = s.split(/(⟦[^⟧]*⟧)/).map(part => {
      if (part.charAt(0) === '⟦') return '<span class="in">' + esc(part.slice(1, -1)) + '</span><span class="enter" aria-hidden="true">↵</span>\n';
      return esc(part);
    }).join('');
    return html + (withCaret ? '<span class="caret" aria-hidden="true"></span>' : '');
  }

  // ---------- memória ----------
  function prevValue(prevFrames, fi, frameName, varName) {
    if (!prevFrames) return undefined;
    const f = prevFrames[fi];
    if (!f || f.name !== frameName) return null;
    const v = f.vars.find(x => x.name === varName);
    return v ? v.value : null;
  }
  const changed = (pv, v) => pv !== undefined && pv !== null && JSON.stringify(pv) !== JSON.stringify(v);

  function scalarHtml(v) {
    if (v === '?') return '<span class="garbage" title="lixo: valor desconhecido">?</span>';
    const s = String(v);
    const k = s.indexOf('→');
    if (k > -1) return '<span class="ptr-addr">' + esc(s.slice(0, k).trim()) + '</span> <span class="ptr-arrow">' + esc(s.slice(k)) + '</span>';
    return esc(s);
  }

  function varHtml(v, pv) {
    const isNew = pv === null;
    const val = v.value;
    let cls = 'var';
    let body = '';
    if (Array.isArray(val) && val.length && typeof val[0] === 'object') {
      cls += ' wide';
      const fields = Object.keys(val[0]);
      body = '<div class="t-wrap"><table class="mini"><thead><tr><th>índice</th>' + fields.map(f => '<th>' + esc(f) + '</th>').join('') + '</tr></thead><tbody>' +
        val.map((row, i) => '<tr><td>[' + i + ']</td>' + fields.map(f => {
          const c = Array.isArray(pv) && pv[i] && changed(pv[i][f], row[f]);
          return '<td><span class="' + (c ? 'chg' : '') + '">' + scalarHtml(row[f]) + '</span></td>';
        }).join('') + '</tr>').join('') + '</tbody></table></div>';
    } else if (Array.isArray(val)) {
      cls += val.length > 5 ? ' wide' : '';
      body = '<div class="cells">' + val.map((c, i) => {
        const ch = Array.isArray(pv) && changed(pv[i], c);
        return '<div class="cell"><span class="cell-v' + (ch ? ' chg' : '') + '">' + scalarHtml(c) + '</span><span class="cell-i">[' + i + ']</span></div>';
      }).join('') + '</div>';
    } else if (val && typeof val === 'object') {
      cls += ' wide';
      body = '<div class="fields">' + Object.keys(val).map(f => {
        const ch = pv && typeof pv === 'object' && changed(pv[f], val[f]);
        return '<span class="f-name">.' + esc(f) + '</span><span><span class="' + (ch ? 'chg' : '') + '">' + scalarHtml(val[f]) + '</span></span>';
      }).join('') + '</div>';
    } else {
      body = '<div class="var-val' + (changed(pv, val) ? ' chg' : '') + '">' + scalarHtml(val) + '</div>';
    }
    if (isNew) cls += ' is-new';
    const addr = v.addr ? '<span title="endereço (exemplo)">@' + esc(v.addr) + '</span>' : '';
    return '<div class="' + cls + '"><div class="var-top"><span class="var-type">' + esc(v.type) + '</span>' + addr + '</div>' +
      '<div class="var-name">' + esc(v.name) + '</div>' + body + '</div>';
  }

  function memHtml(frames, prevFrames) {
    if (!frames.length) return '<p class="mem-empty">O programa ainda não começou a correr.</p>';
    return frames.map((f, fi) => {
      const active = fi === frames.length - 1;
      const vars = f.vars.length
        ? '<div class="vars">' + f.vars.map(v => varHtml(v, prevValue(prevFrames, fi, f.name, v.name))).join('') + '</div>'
        : '<p class="mem-empty">sem variáveis</p>';
      return '<div class="frame' + (active ? ' active' : '') + '"><div class="frame-name"><span>' + esc(f.name) + '()</span>' +
        (active && frames.length > 1 ? '<span>a correr</span>' : (!active ? '<span>em pausa</span>' : '')) + '</div>' + vars + '</div>';
    }).join('');
  }

  // ---------- visualizador ----------
  // Alguns cursos trocam o painel da direita (Memória + Ecrã) por outro, definido em VIZ_SIDE
  // (por exemplo, no SQL: Base de dados + Resultado). Sem VIZ_SIDE fica o painel do C.
  const SIDE = typeof VIZ_SIDE !== 'undefined' ? VIZ_SIDE : null;

  function mountViz(host, ex, num) {
    const steps = buildSteps(ex.steps, ex.db);
    const lines = ex.code.split('\n');
    const hasAddr = ex.steps.some(s => s.d && Object.values(s.d).some(vs => Object.values(vs).some(spec => spec[2])));
    let cur = 0;
    host.className = 'viz';
    host.tabIndex = 0;
    host.setAttribute('aria-label', 'Exemplo ' + num + ': ' + ex.title + '. Usa as setas esquerda e direita para avançar.');
    host.innerHTML =
      '<div class="viz-head">' +
        '<div class="viz-title"><small>Exemplo ' + num + '</small><h3>' + esc(ex.title) + '</h3></div>' +
        '<div class="viz-controls">' +
          '<button class="btn" type="button" data-a="prev">← Anterior</button>' +
          '<span class="viz-count" aria-live="polite"></span>' +
          '<button class="btn btn-primary" type="button" data-a="next">Seguinte →</button>' +
          '<button class="btn btn-ghost" type="button" data-a="reset">Recomeçar</button>' +
        '</div>' +
      '</div>' +
      '<div class="viz-bar"><span></span></div>' +
      '<div class="viz-note"><span class="viz-note-line"></span><div class="viz-note-text"></div></div>' +
      '<div class="viz-grid">' +
        '<div class="panel"><div class="panel-label"><span>Código</span><span>▶ = linha a correr</span></div><div class="code">' +
          lines.map((l, i) => '<div class="ln" data-n="' + (i + 1) + '"><span class="no">' + (i + 1) + '</span><span class="arrow"></span><span class="src">' + (hlLine(l) || ' ') + '</span></div>').join('') +
        '</div></div>' +
        '<div class="viz-side">' + (SIDE ? SIDE.panelsHtml() :
          '<div class="panel"><div class="panel-label"><span>Memória</span>' + (hasAddr ? '<span class="addr-note">endereços de exemplo</span>' : '<span>amarelo = mudou agora</span>') + '</div><div class="mem"></div></div>' +
          '<div class="panel out"><div class="panel-label"><span>Ecrã</span></div><pre class="term"></pre></div>') +
        '</div>' +
      '</div>';

    const btnPrev = $('[data-a="prev"]', host);
    const btnNext = $('[data-a="next"]', host);
    const count = $('.viz-count', host);
    const bar = $('.viz-bar span', host);
    const noteLine = $('.viz-note-line', host);
    const noteText = $('.viz-note-text', host);
    const mem = $('.mem', host);
    const term = $('.term', host);
    const codeBox = $('.code', host);
    const lnEls = $$('.ln', host);

    function render() {
      const s = steps[cur];
      const prev = cur > 0 ? steps[cur - 1] : null;
      lnEls.forEach(el => {
        const on = Number(el.dataset.n) === s.l;
        el.classList.toggle('cur', on);
        $('.arrow', el).textContent = on ? '▶' : '';
      });
      noteLine.textContent = 'linha ' + s.l;
      noteText.innerHTML = s.n;
      if (SIDE) {
        SIDE.render(host, s, prev, { renderTerm, isLast: cur === steps.length - 1 });
      } else {
        mem.innerHTML = memHtml(s.frames, prev ? prev.frames : null);
        term.innerHTML = renderTerm(s.out, cur < steps.length - 1);
        term.scrollTop = term.scrollHeight;
      }
      count.textContent = 'Passo ' + (cur + 1) + ' de ' + steps.length;
      bar.style.width = ((cur + 1) / steps.length * 100) + '%';
      btnPrev.disabled = cur === 0;
      btnNext.disabled = cur === steps.length - 1;
      btnNext.textContent = cur === steps.length - 1 ? 'Fim' : 'Seguinte →';
    }
    function go(i) { cur = Math.max(0, Math.min(steps.length - 1, i)); render(); }
    host.addEventListener('click', e => {
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'prev') go(cur - 1);
      if (a.dataset.a === 'next') go(cur + 1);
      if (a.dataset.a === 'reset') go(0);
    });
    host.addEventListener('keydown', e => {
      if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
      if (e.key === 'Home') { e.preventDefault(); go(0); }
    });
    render();
    void codeBox;
  }

  // ---------- quiz ----------
  // Uma opção de resposta. No SQL, as respostas "mono" são resultados e aparecem como tabelinhas.
  function optionHtml(q, text) {
    if (q.mono && SIDE && SIDE.outputHtml) return '<span class="opt-txt">' + SIDE.outputHtml(text) + '</span>';
    return '<span class="opt-txt' + (q.mono ? ' mono' : '') + '">' + esc(text) + '</span>';
  }

  function mountQuiz(host, lesson) {
    const qs = lesson.quiz;
    let answers = qs.map(() => null);
    function draw() {
      host.innerHTML = qs.map((q, qi) =>
        '<div class="q" data-q="' + qi + '">' +
          '<p class="q-text"><span class="q-num">' + (qi + 1) + '/' + qs.length + '</span><span>' + esc(q.q) + '</span></p>' +
          (q.code ? '<pre class="snip"><code>' + hlBlock(q.code) + '</code></pre>' : '') +
          '<div class="opts" role="group" aria-label="Opções">' + q.opts.map((o, oi) =>
            '<button class="opt" type="button" data-o="' + oi + '"><span class="opt-key">' + 'ABCD'[oi] + '</span>' + optionHtml(q, o) + '</button>'
          ).join('') + '</div>' +
          '<div class="q-exp" hidden></div>' +
        '</div>'
      ).join('') + '<div class="score" hidden></div>';
    }
    function answer(qi, oi) {
      if (answers[qi] !== null) return;
      answers[qi] = oi;
      const q = qs[qi];
      const box = $('[data-q="' + qi + '"]', host);
      $$('.opt', box).forEach((b, i) => {
        b.disabled = true;
        if (i === q.ok) b.classList.add('right');
        else if (i === oi) b.classList.add('wrong');
        else b.classList.add('dim');
      });
      const exp = $('.q-exp', box);
      exp.innerHTML = (oi === q.ok ? '<strong class="ok">Certo.</strong> ' : '<strong class="bad">Não é bem.</strong> A resposta é a ' + 'ABCD'[q.ok] + '. ') + q.exp;
      exp.hidden = false;
      if (answers.every(a => a !== null)) finish();
    }
    function finish() {
      const right = answers.filter((a, i) => a === qs[i].ok).length;
      const prevBest = progress[lesson.id] ? progress[lesson.id].best : 0;
      progress[lesson.id] = { best: Math.max(prevBest, right), total: qs.length };
      saveProgress();
      renderSidebar();
      const msg = right === qs.length ? 'Acertaste todas. Podes passar à lição seguinte.'
        : right * 2 >= qs.length ? 'Quase. Relê as explicações das que falhaste e corre outra vez o exemplo.'
        : 'Volta a correr o exemplo passo a passo, com calma, e tenta outra vez.';
      const sc = $('.score', host);
      sc.innerHTML = '<div><span class="score-num">' + right + '/' + qs.length + '</span><p>' + msg + '</p></div><button class="btn" type="button" data-retry>Repetir perguntas</button>';
      sc.hidden = false;
    }
    host.addEventListener('click', e => {
      if (e.target.closest('[data-retry]')) { answers = qs.map(() => null); draw(); return; }
      const b = e.target.closest('.opt');
      if (!b) return;
      answer(Number(b.closest('[data-q]').dataset.q), Number(b.dataset.o));
    });
    draw();
  }

  // ---------- exercícios ----------
  // O que o programa da solução mostra. No SQL é o resultado da consulta, como tabela.
  function runHtml(run) {
    if (SIDE && SIDE.outputHtml) return '<div><div class="ex-label">Resultado esperado</div>' + SIDE.outputHtml(run) + '</div>';
    return '<div><div class="ex-label">Exemplo de execução (a amarelo, o que escreves)</div><pre class="term">' + renderTerm(run, false) + '</pre></div>';
  }

  function exHtml(ex, i) {
    return '<article class="ex">' +
      '<h3>Exercício ' + (i + 1) + ': ' + esc(ex.title) + '</h3>' +
      '<p>' + esc(ex.text) + '</p>' +
      runHtml(ex.run) +
      '<details><summary>Ver dica</summary><div class="det-body"><p>' + ex.hint + '</p></div></details>' +
      '<details><summary>Ver solução</summary><div class="det-body"><pre class="snip"><code>' + hlBlock(ex.solution) + '</code></pre>' +
        '<div class="sol-tools"><button class="btn" type="button" data-copy="' + i + '">Copiar código</button></div></div></details>' +
    '</article>';
  }

  // ---------- vistas ----------
  const view = $('#view');

  function renderHome() {
    view.innerHTML = '';
    view.appendChild($('#tpl-home').content.cloneNode(true));
    const next = LESSONS.find(l => !isDone(l.id));
    const actions = $('#hero-actions');
    if (!Object.keys(progress).length) {
      actions.innerHTML = '<a class="btn btn-primary" href="#licao-0">Começar pela lição 0</a><a class="btn" href="#cabula">Ver a cábula</a>';
    } else if (next) {
      actions.innerHTML = '<a class="btn btn-primary" href="#licao-' + next.id + '">Continuar: lição ' + next.id + '</a><a class="btn" href="#cabula">Ver a cábula</a>';
    } else {
      actions.innerHTML = '<a class="btn btn-primary" href="#cabula">Rever a cábula</a><a class="btn" href="#licao-0">Recomeçar as lições</a>';
    }
    $('#home-lessons').innerHTML = LESSONS.map(l =>
      '<a class="card-lesson" href="#licao-' + l.id + '"><span class="nav-num">' + l.id + '</span><strong>' + esc(l.title) + '</strong><span class="s">' + esc(l.short) + '</span>' +
      (isDone(l.id) ? '<span class="done-tag">Feita · ' + progress[l.id].best + '/' + progress[l.id].total + '</span>' : '') + '</a>'
    ).join('');
  }

  function renderCheat() {
    view.innerHTML = '';
    view.appendChild($('#tpl-cheat').content.cloneNode(true));
    highlightStatic(view);
  }

  function renderLesson(id) {
    const L = LESSONS[id];
    const prev = LESSONS[id - 1];
    const next = LESSONS[id + 1];
    view.innerHTML =
      '<section class="lesson-head"><span class="eyebrow">Lição ' + L.id + ' de ' + (LESSONS.length - 1) + '</span><h1>' + esc(L.title) + '</h1><p class="lead">' + esc(L.short.charAt(0).toUpperCase() + L.short.slice(1)) + '.</p></section>' +
      '<section class="prose">' + L.body + '</section>' +
      '<aside class="analogy"><span class="analogy-label">Pensa assim</span><p>' + L.analogy + '</p></aside>' +
      (L.db && SIDE && SIDE.dbHtml ? '<section class="section"><div class="section-head"><h2>A base de dados desta lição</h2><p>Os exemplos, as perguntas e os exercícios usam estas tabelas.</p></div>' + SIDE.dbHtml(L.db) + '</section>' : '') +
      '<section class="section"><div class="section-head"><h2>Vê a correr</h2><p>Carrega em "Seguinte" (ou usa as setas do teclado) e acompanha a linha amarela, a memória e o ecrã.</p></div>' +
        L.examples.map((_, i) => '<div data-viz="' + i + '"></div>').join('') + '</section>' +
      '<section class="section"><div class="section-head"><h2>Erros comuns</h2></div><ul class="mistakes">' + L.mistakes.map(m => '<li>' + m + '</li>').join('') + '</ul></section>' +
      '<section class="section"><div class="section-head"><h2>Testa-te</h2><p>Responde sem correr o código. Se precisares, faz a tabela de execução no papel.</p></div><div class="quiz" id="quiz"></div></section>' +
      '<section class="section"><div class="section-head"><h2>Pratica</h2><p>Escreve o programa no computador antes de abrires a solução.</p></div><div class="exs">' + L.exercises.map(exHtml).join('') + '</div></section>' +
      '<nav class="pager" aria-label="Navegação entre lições">' +
        (prev ? '<a href="#licao-' + prev.id + '"><small>← Anterior</small><span>' + prev.id + '. ' + esc(prev.title) + '</span></a>' : '<a href="#inicio"><small>← Início</small><span>Como usar</span></a>') +
        (next ? '<a class="next" href="#licao-' + next.id + '"><small>Seguinte →</small><span>' + next.id + '. ' + esc(next.title) + '</span></a>' : '<a class="next" href="#cabula"><small>Seguinte →</small><span>' + esc(COURSE.cheatTitle) + '</span></a>') +
      '</nav>';
    L.examples.forEach((ex, i) => mountViz($('[data-viz="' + i + '"]', view), ex, i + 1));
    mountQuiz($('#quiz', view), L);
    highlightStatic(view);
    view.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const code = L.exercises[Number(btn.dataset.copy)].solution;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = 'Copiado';
        } catch (e) {
          const pre = btn.closest('.det-body').querySelector('pre');
          const r = document.createRange();
          r.selectNodeContents(pre);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
          btn.textContent = 'Selecionado: usa Ctrl+C';
        }
        setTimeout(() => { btn.textContent = 'Copiar código'; }, 2200);
      });
    });
  }

  // ---------- barra lateral ----------
  function currentKey() {
    const h = location.hash.replace('#', '');
    if (h === 'cabula') return 'cabula';
    const m = h.match(/^licao-(\d+)$/);
    if (m && LESSONS[Number(m[1])]) return 'licao-' + m[1];
    return 'inicio';
  }
  function renderSidebar() {
    const key = currentKey();
    const done = LESSONS.filter(l => isDone(l.id)).length;
    $('#progress').innerHTML = '<span>' + done + ' de ' + LESSONS.length + ' lições feitas</span><div class="progress-track"><div class="progress-fill" style="width:' + (done / LESSONS.length * 100) + '%"></div></div>';
    const cur = k => (key === k ? ' aria-current="page"' : '');
    $('#nav').innerHTML =
      '<a href="#inicio"' + cur('inicio') + '><span class="nav-icon">~</span><span>Início</span><span></span></a>' +
      '<div class="nav-label">Lições</div>' +
      LESSONS.map(l => '<a href="#licao-' + l.id + '"' + cur('licao-' + l.id) + '><span class="nav-num">' + l.id + '</span><span>' + esc(l.title) + '</span><span class="nav-done">' + (isDone(l.id) ? '✓' : '') + '</span></a>').join('') +
      '<div class="nav-label">Consulta</div>' +
      '<a href="#cabula"' + cur('cabula') + '><span class="nav-icon">{ }</span><span>' + esc(COURSE.cheatTitle) + '</span><span></span></a>';
  }

  // ---------- menu no telemóvel ----------
  const sidebar = $('#sidebar');
  const menuBtn = $('#menu-btn');
  let scrim = null;
  function setMenu(open) {
    sidebar.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    if (open && !scrim) {
      scrim = document.createElement('div');
      scrim.className = 'scrim';
      scrim.addEventListener('click', () => setMenu(false));
      document.body.appendChild(scrim);
    } else if (!open && scrim) {
      scrim.remove();
      scrim = null;
    }
  }
  menuBtn.addEventListener('click', () => setMenu(!sidebar.classList.contains('open')));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

  // ---------- rotas ----------
  function route() {
    const key = currentKey();
    if (key === 'cabula') renderCheat();
    else if (key.indexOf('licao-') === 0) renderLesson(Number(key.slice(6)));
    else renderHome();
    renderSidebar();
    setMenu(false);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
