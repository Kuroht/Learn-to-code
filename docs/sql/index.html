<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL do Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Caderno de laboratório: papel azulado, tinta azul-escura, marcador amarelo na linha que está a correr.
     Layout: barra lateral com as lições + coluna de leitura; o visualizador alarga para código | memória + ecrã. */
  --paper: #f2f4f8;
  --panel: #ffffff;
  --ink: #161d2e;
  --muted: #586276;
  --line: #d9dfea;
  --accent: #2547d0;
  --accent-ink: #ffffff;
  --accent-soft: #e6ebfc;
  --mark: #ffe58a;
  --mark-edge: #d9a514;
  --ok: #17804a;
  --ok-soft: #e1f3e8;
  --bad: #bf3329;
  --bad-soft: #fbe6e3;
  --code-bg: #f8f9fc;
  --term-bg: #121826;
  --term-ink: #dfe6f3;
  --term-in: #ffd866;
  --t-kw: #7a2bc2;
  --t-ty: #0b7584;
  --t-str: #a0450a;
  --t-num: #ad1767;
  --t-com: #737d90;
  --t-pp: #39691a;
  --t-fn: #2547d0;
  --shadow: 0 1px 2px rgba(22, 29, 46, .06), 0 6px 20px rgba(22, 29, 46, .05);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f121a;
    --panel: #161b25;
    --ink: #e6e9f1;
    --muted: #98a1b4;
    --line: #283041;
    --accent: #8ea5ff;
    --accent-ink: #0f121a;
    --accent-soft: #1d2645;
    --mark: rgba(255, 210, 60, .2);
    --mark-edge: #e9bd3a;
    --ok: #4cc47f;
    --ok-soft: rgba(76, 196, 127, .14);
    --bad: #ff7d70;
    --bad-soft: rgba(255, 125, 112, .14);
    --code-bg: #121620;
    --term-bg: #0a0d14;
    --t-kw: #c79bf2;
    --t-ty: #63d3e2;
    --t-str: #f4a46d;
    --t-num: #ff8cc4;
    --t-com: #7e899f;
    --t-pp: #a8d873;
    --t-fn: #8ea5ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f121a;
  --panel: #161b25;
  --ink: #e6e9f1;
  --muted: #98a1b4;
  --line: #283041;
  --accent: #8ea5ff;
  --accent-ink: #0f121a;
  --accent-soft: #1d2645;
  --mark: rgba(255, 210, 60, .2);
  --mark-edge: #e9bd3a;
  --ok: #4cc47f;
  --ok-soft: rgba(76, 196, 127, .14);
  --bad: #ff7d70;
  --bad-soft: rgba(255, 125, 112, .14);
  --code-bg: #121620;
  --term-bg: #0a0d14;
  --t-kw: #c79bf2;
  --t-ty: #63d3e2;
  --t-str: #f4a46d;
  --t-num: #ff8cc4;
  --t-com: #7e899f;
  --t-pp: #a8d873;
  --t-fn: #8ea5ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.6 var(--font-body);
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 1.5rem + 2vw, 2.9rem); font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.15rem; font-weight: 600; }
h4 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
code, pre, kbd { font-family: var(--font-mono); font-size: .88em; }
/* Sem ligaduras: quem aprende tem de ver === e => tal como se escrevem, não como um só símbolo. */
code, pre, kbd, .code, .term, .var, .name, .obj, .grid, .opt-txt.mono { font-variant-ligatures: none; }
:not(pre) > code {
  background: var(--accent-soft);
  padding: .08em .35em;
  border-radius: 5px;
  white-space: nowrap;
}

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 276px minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 22px 14px 28px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 10px; text-decoration: none; color: var(--ink); }
.brand-mark {
  font-family: var(--font-mono); font-weight: 600; font-size: .95rem;
  background: var(--ink); color: var(--panel); padding: 2px 7px; border-radius: 6px;
}
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: -.01em; }
.progress { padding: 0 10px; display: grid; gap: 6px; font-size: .85rem; color: var(--muted); }
.progress-track { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.nav { display: grid; gap: 2px; }
.nav-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
.nav a {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .95rem; line-height: 1.3;
}
.nav a:hover { background: var(--paper); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav-num {
  font-family: var(--font-mono); font-size: .78rem; color: var(--muted); text-align: center;
  border: 1px solid var(--line); border-radius: 6px; padding: 1px 0;
}
.nav a[aria-current="page"] .nav-num { border-color: var(--accent); color: var(--accent); }
.nav-done { color: var(--ok); font-size: .85rem; font-weight: 700; }
.nav-icon { width: 26px; text-align: center; color: var(--muted); font-family: var(--font-mono); font-size: .8rem; }

main { padding: 36px clamp(16px, 4vw, 52px) 96px; min-width: 0; }
.content { max-width: 1060px; margin: 0 auto; display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr); }
/* As grelhas de dentro também não podem crescer com uma linha de código comprida (o pre tem scroll próprio). */
.section, .quiz, .q, .exs, .ex, .det-body { grid-template-columns: minmax(0, 1fr); }
.prose { max-width: 68ch; display: grid; gap: 14px; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

.topbar { display: none; }

/* ---------- tabelas ---------- */
.t-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: .93rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.t th, .t td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--code-bg); }
.t tr:last-child td { border-bottom: 0; }
.t td code { white-space: nowrap; }

/* ---------- código ---------- */
pre { margin: 0; }
pre.snip {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; overflow-x: auto; line-height: 1.55;
}
.t-kw { color: var(--t-kw); font-weight: 600; }
.t-ty { color: var(--t-ty); font-weight: 600; }
.t-str { color: var(--t-str); }
.t-num { color: var(--t-num); }
.t-com { color: var(--t-com); font-style: italic; }
.t-pp { color: var(--t-pp); }
.t-fn { color: var(--t-fn); }

/* ---------- cabeçalho da lição ---------- */
.lesson-head { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: .82rem; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 60ch; }
.analogy {
  max-width: 68ch; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--mark-edge);
  border-radius: 10px; padding: 14px 18px; display: grid; gap: 4px;
}
.analogy-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.section { display: grid; gap: 16px; }
.section-head { display: grid; gap: 4px; }
.section-head p { color: var(--muted); }

/* ---------- visualizador ---------- */
.viz {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 16px; display: grid; gap: 12px;
}
.viz:focus-visible { outline-offset: 4px; border-radius: 14px; }
.viz-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.viz-title { display: grid; gap: 2px; }
.viz-title small { font-family: var(--font-mono); color: var(--muted); font-size: .78rem; }
.viz-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.viz-count { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); min-width: 9.5em; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn {
  font: inherit; font-size: .92rem; font-weight: 700; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 7px 14px; border-radius: 9px; line-height: 1.2;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.08); }
.btn-ghost { border-color: transparent; color: var(--muted); }
.viz-bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.viz-bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.viz-note {
  background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; min-height: 3.4em;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start;
}
.viz-note code { background: var(--panel); }
.viz-note-line { font-family: var(--font-mono); font-size: .78rem; font-weight: 600; color: var(--accent); background: var(--panel); border-radius: 6px; padding: 2px 7px; margin-top: 2px; white-space: nowrap; }
.viz-grid { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.viz-side { display: grid; gap: 12px; }
.panel { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.panel-label {
  font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
  padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; justify-content: space-between; gap: 8px;
}
.code { overflow-x: auto; padding: 8px 0; font-family: var(--font-mono); font-size: .86rem; line-height: 1.65; }
.ln { display: grid; grid-template-columns: 2.6em 1.3em minmax(0, 1fr); white-space: pre; min-width: max-content; padding-right: 14px; }
.ln .no { text-align: right; color: var(--t-com); opacity: .8; user-select: none; }
.ln .arrow { text-align: center; color: var(--mark-edge); user-select: none; }
.ln.cur { background: var(--mark); box-shadow: inset 3px 0 0 var(--mark-edge); }
.ln.cur .no { color: var(--ink); opacity: 1; font-weight: 600; }

.mem { padding: 10px; display: grid; gap: 10px; min-height: 92px; }
.mem-empty { color: var(--muted); font-size: .9rem; padding: 6px 4px; }
.frame { border: 1px dashed var(--line); border-radius: 9px; padding: 8px; display: grid; gap: 8px; background: var(--panel); }
.frame.active { border: 1px solid var(--accent); }
.frame-name { font-family: var(--font-mono); font-size: .78rem; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
.frame.active .frame-name { color: var(--accent); }
.vars { display: flex; flex-wrap: wrap; gap: 8px; }
.var {
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px 7px; background: var(--code-bg);
  display: grid; gap: 2px; min-width: 76px; max-width: 100%;
}
.var.wide { flex-basis: 100%; }
.var-top { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-mono); font-size: .7rem; color: var(--muted); }
.var-type { color: var(--t-ty); }
.var-name { font-family: var(--font-mono); font-weight: 600; font-size: .9rem; }
.var-val { font-family: var(--font-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; border-radius: 5px; padding: 0 3px; margin: 0 -3px; overflow-wrap: anywhere; }
.chg { background: var(--mark); box-shadow: 0 0 0 2px var(--mark-edge); }
.var.is-new { border-color: var(--accent); }
.garbage { color: var(--muted); font-style: italic; }
.ptr-addr { color: var(--t-num); }
.ptr-arrow { color: var(--accent); font-size: .9rem; font-weight: 600; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.cell { display: grid; text-align: center; min-width: 2.7em; }
.cell-v { font-family: var(--font-mono); font-size: .92rem; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 2px 4px; }
.cell-i { font-family: var(--font-mono); font-size: .66rem; color: var(--muted); }
.fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-family: var(--font-mono); font-size: .88rem; margin-top: 2px; }
.fields .f-name { color: var(--muted); }
.mini { border-collapse: collapse; font-family: var(--font-mono); font-size: .84rem; margin-top: 4px; }
.mini th, .mini td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; }
.mini th { font-weight: 600; color: var(--muted); font-size: .72rem; background: var(--panel); }
.addr-note { font-size: .74rem; color: var(--muted); }

.term {
  background: var(--term-bg); color: var(--term-ink); font-family: var(--font-mono); font-size: .86rem;
  line-height: 1.6; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 4.8em; max-height: 15em; overflow-y: auto;
}
.term .in { color: var(--term-in); font-weight: 600; }
.term .err-line { color: #ff8a7a; font-weight: 600; }
.term .enter { color: var(--term-in); opacity: .55; font-size: .8em; margin-left: 2px; }
.term .caret { display: inline-block; width: .55em; height: 1.05em; background: var(--term-ink); opacity: .55; vertical-align: text-bottom; }
.term .ph { color: #7e899f; font-style: italic; }
.panel.out { background: var(--term-bg); border-color: var(--term-bg); }
.panel.out .panel-label { background: var(--term-bg); color: #9aa6bd; border-color: #263046; }

/* ---------- erros comuns ---------- */
.mistakes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 76ch; }
.mistakes li { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 9px; padding: 10px 14px; }

/* ---------- quiz ---------- */
.quiz { display: grid; gap: 14px; }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.q-text { font-weight: 700; display: flex; gap: 10px; align-items: baseline; }
.q-num { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.opt {
  font: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start;
  border: 1px solid var(--line); background: var(--code-bg); color: var(--ink); border-radius: 9px; padding: 9px 12px;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt-key { font-family: var(--font-mono); font-size: .78rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; margin-top: 2px; background: var(--panel); }
.opt-txt.mono { font-family: var(--font-mono); font-size: .9rem; white-space: pre; overflow-x: auto; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .opt-key { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .opt-key { border-color: var(--bad); color: var(--bad); }
.opt.dim { opacity: .55; }
.q-exp { border-radius: 9px; padding: 10px 14px; background: var(--code-bg); border: 1px solid var(--line); }
.q-exp strong.ok { color: var(--ok); }
.q-exp strong.bad { color: var(--bad); }
.score {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
}
.score-num { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }

/* ---------- exercícios ---------- */
.exs { display: grid; gap: 14px; }
.ex { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.ex-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 4px; }
.ex .term { border-radius: 9px; max-height: none; min-height: 0; }
details { border: 1px solid var(--line); border-radius: 9px; background: var(--code-bg); }
summary { cursor: pointer; padding: 9px 14px; font-weight: 700; color: var(--accent); }
details[open] summary { border-bottom: 1px solid var(--line); }
.det-body { padding: 12px 14px; display: grid; gap: 10px; }
.det-body pre.snip { background: var(--panel); }
.sol-tools { display: flex; justify-content: flex-end; }

/* ---------- navegação entre lições ---------- */
.pager { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 24px; }
.pager a {
  display: grid; gap: 2px; text-decoration: none; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 220px;
}
.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--muted); font-size: .8rem; }
.pager .next { text-align: right; margin-left: auto; }

/* ---------- início ---------- */
.hero { display: grid; gap: 16px; padding-top: 8px; }
.hero p { font-size: 1.15rem; color: var(--muted); max-width: 58ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.hero-actions .btn { padding: 10px 18px; font-size: 1rem; text-decoration: none; display: inline-block; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; counter-reset: s; }
.steps li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; counter-increment: s; align-content: start; }
.steps li::before { content: counter(s); font-family: var(--font-mono); font-weight: 600; font-size: .8rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; width: 1.8em; text-align: center; }
.steps p { color: var(--muted); font-size: .95rem; }
.grid-lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card-lesson {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; text-decoration: none; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; align-content: start;
}
.card-lesson:hover { border-color: var(--accent); }
.card-lesson .nav-num { grid-row: span 2; width: 28px; height: 24px; line-height: 20px; }
.card-lesson strong { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; line-height: 1.25; }
.card-lesson span.s { color: var(--muted); font-size: .88rem; line-height: 1.35; }
.card-lesson .done-tag { grid-column: 2; font-size: .78rem; font-weight: 700; color: var(--ok); }

<template id="tpl-cheat">
  <section class="lesson-head">
    <span class="eyebrow">Resumo</span>
    <h1>Cábula de SQL</h1>
    <p class="lead">Tudo o que as lições ensinam, numa página. Boa para ter aberta enquanto fazes exercícios.</p>
  </section>
  <div class="cheat">
    <div class="box">
      <h3>Uma consulta completa</h3>
<pre class="snip"><code class="sql">SELECT curso, COUNT(*) AS n      -- 5. colunas
FROM alunos                      -- 1. tabela
WHERE nota &gt;= 10                 -- 2. linhas
GROUP BY curso                   -- 3. grupos
HAVING COUNT(*) &gt;= 2             -- 4. grupos que ficam
ORDER BY n DESC                  -- 6. ordem
LIMIT 3;                         -- 7. quantas</code></pre>
      <p>Os números dizem a ordem em que o SGBD trabalha.</p>
    </div>

    <div class="box">
      <h3>Criar e mudar dados</h3>
<pre class="snip"><code class="sql">CREATE TABLE alunos (
    numero INTEGER PRIMARY KEY,
    nome TEXT NOT NULL,
    curso TEXT REFERENCES cursos(sigla),
    nota INTEGER
);
INSERT INTO alunos VALUES (101, 'Ana', 'LEI', 17);
INSERT INTO alunos (numero, nome) VALUES (102, 'Rui');
UPDATE alunos SET nota = nota + 1 WHERE numero = 102;
DELETE FROM alunos WHERE nota &lt; 10;
DROP TABLE alunos;               -- apaga a própria tabela</code></pre>
      <p><strong>UPDATE e DELETE sem WHERE afetam todas as linhas.</strong> Testa o WHERE primeiro com um SELECT.</p>
    </div>

    <div class="box">
      <h3>Condições (WHERE e HAVING)</h3>
      <div class="t-wrap"><table class="t">
        <tbody>
          <tr><td><code>= &lt;&gt; != &lt; &gt; &lt;= &gt;=</code></td><td>comparar (igual é um só <code>=</code>)</td></tr>
          <tr><td><code>AND OR NOT</code></td><td>e, ou, não (usa parênteses)</td></tr>
          <tr><td><code>BETWEEN 10 AND 14</code></td><td>inclui o 10 e o 14</td></tr>
          <tr><td><code>IN ('LEI', 'LEM')</code></td><td>igual a um destes</td></tr>
          <tr><td><code>LIKE 'M%'</code></td><td><code>%</code> qualquer texto, <code>_</code> um carácter</td></tr>
          <tr><td><code>IS NULL</code>, <code>IS NOT NULL</code></td><td>nunca <code>= NULL</code></td></tr>
        </tbody>
      </table></div>
      <p>Texto entre plicas: <code>'LEI'</code>. As aspas são para nomes de colunas.</p>
    </div>

    <div class="box">
      <h3>Funções de agregação</h3>
      <div class="t-wrap"><table class="t">
        <tbody>
          <tr><td><code>COUNT(*)</code></td><td>número de linhas</td></tr>
          <tr><td><code>COUNT(col)</code></td><td>linhas com valor (sem os NULL)</td></tr>
          <tr><td><code>COUNT(DISTINCT col)</code></td><td>valores diferentes</td></tr>
          <tr><td><code>SUM AVG MIN MAX</code></td><td>soma, média, menor, maior (ignoram NULL)</td></tr>
          <tr><td><code>ROUND(x, 2)</code></td><td>arredonda a 2 casas</td></tr>
          <tr><td><code>COALESCE(x, 0)</code></td><td>x, ou 0 se x for NULL</td></tr>
        </tbody>
      </table></div>
      <p>Inteiro / inteiro dá inteiro, como em C: <code>7 / 2</code> é 3. Usa <code>AVG</code> ou <code>7 / 2.0</code>.</p>
    </div>

    <div class="box">
      <h3>JOIN</h3>
<pre class="snip"><code class="sql">-- só as linhas com par
SELECT a.nome, c.nome AS curso
FROM alunos a
JOIN cursos c ON a.curso = c.sigla;

-- todas as da esquerda; sem par fica NULL
SELECT a.nome
FROM alunos a
LEFT JOIN inscricoes i ON i.aluno = a.numero
WHERE i.aluno IS NULL;           -- "quem não tem nenhuma"</code></pre>
    </div>

    <div class="box">
      <h3>Chaves e relações</h3>
      <div class="t-wrap"><table class="t">
        <tbody>
          <tr><td>Chave primária (PK)</td><td>identifica a linha; única e não NULL</td></tr>
          <tr><td>Chave estrangeira (FK)</td><td>guarda a PK de uma linha de outra tabela</td></tr>
          <tr><td>1:N</td><td>FK no lado N (<code>alunos.curso</code>)</td></tr>
          <tr><td>N:M</td><td>tabela de ligação com as duas FK; PK = o par</td></tr>
          <tr><td>SQLite</td><td><code>PRAGMA foreign_keys = ON;</code> para as FK serem verificadas</td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="box">
      <h3>Formas normais</h3>
      <div class="t-wrap"><table class="t">
        <tbody>
          <tr><td>1FN</td><td>um valor por célula (nada de listas)</td></tr>
          <tr><td>2FN</td><td>o que não é chave depende da chave <strong>toda</strong></td></tr>
          <tr><td>3FN</td><td>o que não é chave não depende de outra coluna que não é chave</td></tr>
        </tbody>
      </table></div>
      <p>Quando falha: tira essas colunas para uma tabela nova e deixa uma FK.</p>
    </div>

    <div class="box">
      <h3>Mensagens de erro do SQLite</h3>
      <div class="t-wrap"><table class="t">
        <thead><tr><th>Mensagem</th><th>Costuma ser</th></tr></thead>
        <tbody>
          <tr><td><code>no such table: aluno</code></td><td>nome da tabela mal escrito, ou ainda não criada</td></tr>
          <tr><td><code>no such column: idade</code></td><td>coluna mal escrita, ou texto sem plicas (<code>= LEI</code>)</td></tr>
          <tr><td><code>no such column: "Ana" - should this be a string literal in single-quotes?</code></td><td>texto entre aspas em vez de plicas</td></tr>
          <tr><td><code>near "SELEC": syntax error</code></td><td>palavra mal escrita, vírgula a mais ou a menos perto daí</td></tr>
          <tr><td><code>incomplete input</code></td><td>a instrução acabou a meio (falta a condição, um parêntese...)</td></tr>
          <tr><td><code>ambiguous column name: nome</code></td><td>num JOIN, as duas tabelas têm essa coluna: usa <code>a.nome</code></td></tr>
          <tr><td><code>misuse of aggregate function COUNT()</code></td><td>função de agregação no WHERE: vai para o HAVING</td></tr>
          <tr><td><code>HAVING clause on a non-aggregate query</code></td><td>HAVING sem GROUP BY nem funções: usa WHERE</td></tr>
          <tr><td><code>UNIQUE constraint failed: alunos.numero</code></td><td>chave primária repetida</td></tr>
          <tr><td><code>NOT NULL constraint failed: alunos.nome</code></td><td>faltou um valor obrigatório</td></tr>
          <tr><td><code>FOREIGN KEY constraint failed</code></td><td>a FK aponta para uma linha que não existe, ou apagaste uma linha que ainda é apontada</td></tr>
          <tr><td><code>table alunos has 4 columns but 3 values were supplied</code></td><td>INSERT com valores a menos: indica as colunas</td></tr>
          <tr><td><code>table alunos already exists</code></td><td>CREATE TABLE repetido</td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="box">
      <h3>SQLite e os outros SGBD</h3>
      <div class="t-wrap"><table class="t">
        <thead><tr><th>SQLite</th><th>MySQL / PostgreSQL / Oracle</th></tr></thead>
        <tbody>
          <tr><td><code>INTEGER</code>, <code>REAL</code>, <code>TEXT</code></td><td><code>INT</code>, <code>DECIMAL(4,1)</code>, <code>VARCHAR(50)</code></td></tr>
          <tr><td>FK só com <code>PRAGMA foreign_keys = ON</code></td><td>FK sempre verificadas</td></tr>
          <tr><td>aceita <code>SELECT nome, COUNT(*)</code> sem GROUP BY</td><td>dá erro (e com razão)</td></tr>
          <tr><td><code>LIMIT 3</code></td><td>Oracle: <code>FETCH FIRST 3 ROWS ONLY</code></td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="box">
      <h3>Antes de entregar</h3>
      <ul class="checklist">
        <li>O texto está entre plicas e as colunas sem nada.</li>
        <li>Os UPDATE e DELETE têm WHERE (e testaste-o com um SELECT).</li>
        <li>Os NULL são testados com <code>IS NULL</code>.</li>
        <li>Com GROUP BY, o SELECT só tem colunas do grupo e funções.</li>
        <li>As condições sobre funções estão no HAVING, não no WHERE.</li>
        <li>Num JOIN, há um <code>ON</code> certo e as colunas repetidas levam a alcunha da tabela.</li>
        <li>Para "quem não tem", usaste LEFT JOIN e IS NULL.</li>
        <li>Se a ordem interessa, há ORDER BY.</li>
      </ul>
    </div>
  </div>
</template>

// Troca o painel "Memória + Ecrã" por "Base de dados + Resultado". Só entra nas páginas cujo
// course.js diz viz: 'tables'. Também corre em Node (o runner de SQL usa o dbToSql).

// Texto de uma célula, igual ao que o check gera a partir do SQLite: NULL aparece como NULL.
function cellText(value) {
  if (value === null) return 'NULL';
  return String(value);
}

// O SQL que cria uma base de dados descrita como { tabela: { cols, key?, rows } }.
function dbToSql(db) {
  const literal = v => {
    if (v === null) return 'NULL';
    if (typeof v === 'number') return String(v);
    if (/^-?\d+\.\d+$/.test(v)) return v; // reais escritos como texto ('14.0') para manter o .0
    return "'" + String(v).replace(/'/g, "''") + "'";
  };
  return Object.entries(db).map(([name, spec]) => {
    const lines = spec.cols.map(([col, def]) => '    ' + col + ' ' + def);
    if (spec.key) lines.push('    PRIMARY KEY (' + spec.key.join(', ') + ')');
    const create = 'CREATE TABLE ' + name + ' (\n' + lines.join(',\n') + '\n);';
    const inserts = (spec.rows || []).map(r => 'INSERT INTO ' + name + ' VALUES (' + r.map(literal).join(', ') + ');');
    return [create].concat(inserts).join('\n');
  }).join('\n\n');
}

// Cada visualizador regista-se em VIZ_MODES com o seu nome; um curso (ou um exemplo) escolhe qual usa.
if (typeof VIZ_MODES === 'undefined') var VIZ_MODES = {};
VIZ_MODES.tables = (function () {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function cellHtml(value, changed) {
    const cls = (value === null ? 'null' : '') + (changed ? ' chg' : '');
    return '<td><span class="' + cls.trim() + '">' + esc(cellText(value)) + '</span></td>';
  }

  // Cabeçalho de uma tabela da base de dados: nome, tipo e as etiquetas PK / FK.
  function colHead(col) {
    const tags = (col.pk ? '<span class="tag tag-pk" title="chave primária">PK</span>' : '') +
      (col.fk ? '<span class="tag tag-fk" title="chave estrangeira: aponta para ' + esc(col.fk) + '">FK→' + esc(col.fk) + '</span>' : '');
    return '<th><span class="col-name">' + esc(col.name) + '</span>' + tags + '<span class="col-type">' + esc(col.type) + '</span></th>';
  }

  // Uma tabela da base de dados. prev é a mesma tabela no passo anterior (para pintar o que mudou);
  // undefined quer dizer que a tabela acabou de ser criada.
  function tableHtml(name, table, prev, marks) {
    const prevRows = {};
    if (prev) prev.rows.forEach(r => { prevRows[r.id] = r; });
    const isNewTable = prev === undefined;
    const body = table.rows.length
      ? table.rows.map((row, i) => {
        const old = prevRows[row.id];
        const mark = marks && marks[i] ? ' row-' + marks[i] : '';
        const isNew = !isNewTable && !old ? ' row-new' : '';
        return '<tr class="' + (mark + isNew).trim() + '">' +
          row.cells.map((v, c) => cellHtml(v, old && cellText(old.cells[c]) !== cellText(v))).join('') + '</tr>';
      }).join('')
      : '<tr><td class="empty" colspan="' + table.cols.length + '">(sem linhas)</td></tr>';
    return '<div class="dbt' + (isNewTable ? ' is-new' : '') + '"><div class="dbt-name">' + esc(name) +
      '<span>' + table.rows.length + (table.rows.length === 1 ? ' linha' : ' linhas') + '</span></div>' +
      '<div class="t-wrap"><table class="grid"><thead><tr>' + table.cols.map(colHead).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
  }

  function tablesHtml(tables, prevTables, tmarks) {
    const names = Object.keys(tables);
    if (!names.length) return '<p class="mem-empty">A base de dados ainda não tem tabelas.</p>';
    // No primeiro passo não há passo anterior: compara a tabela consigo própria, para nada aparecer como novo.
    return names.map(n => tableHtml(n, tables[n], prevTables ? prevTables[n] : tables[n], tmarks[n])).join('');
  }

  // A grelha de trabalho da consulta. marks por linha: 'keep' (passa), 'drop' (fica de fora), 'hit' (em destaque).
  // groups: tamanhos dos grupos do GROUP BY, pela ordem das linhas.
  function gridHtml(g, err) {
    if (err) return '<div class="sql-err"><strong>Erro</strong><code>' + esc(err) + '</code></div>';
    if (!g) return '<p class="mem-empty">Nenhuma consulta a correr.</p>';
    const groupOf = [];
    (g.groups || []).forEach((size, gi) => { for (let k = 0; k < size; k++) groupOf.push(gi); });
    const rows = g.rows.length
      ? g.rows.map((r, i) => {
        const cls = [];
        if (g.marks && g.marks[i]) cls.push('row-' + g.marks[i]);
        if (g.groups) {
          cls.push(groupOf[i] % 2 ? 'grp-b' : 'grp-a');
          if (i > 0 && groupOf[i] !== groupOf[i - 1]) cls.push('grp-start');
        }
        return '<tr class="' + cls.join(' ') + '">' + r.map(v => cellHtml(v, false)).join('') + '</tr>';
      }).join('')
      : '<tr><td class="empty" colspan="' + g.cols.length + '">(nenhuma linha)</td></tr>';
    const count = g.rows.filter((_, i) => !(g.marks && g.marks[i] === 'drop')).length;
    return (g.label ? '<div class="grid-label"><code>' + esc(g.label) + '</code><span>' + count + (count === 1 ? ' linha' : ' linhas') + '</span></div>' : '') +
      '<div class="t-wrap"><table class="grid"><thead><tr>' + g.cols.map(c => '<th><span class="col-name">' + esc(c) + '</span></th>').join('') +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  // Resultado em texto (como o sqlite3 com .headers on: "nome|nota" e uma linha por resultado)
  // mostrado como tabelinhas. Os conjuntos de resultados vêm separados por uma linha vazia.
  function outputHtml(text) {
    const blocks = text.replace(/\n+$/, '').split(/\n\n/);
    return '<div class="out-grids">' + blocks.map(block => {
      if (block.indexOf('Erro: ') === 0) return '<div class="sql-err"><strong>Erro</strong><code>' + esc(block.slice(6)) + '</code></div>';
      const lines = block.split('\n');
      const head = lines[0].split('|');
      const body = lines.slice(1).map(l => l.split('|'));
      return '<table class="grid mini-grid"><thead><tr>' + head.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
        (body.length ? body.map(r => '<tr>' + r.map(v => '<td' + (v === 'NULL' ? ' class="null"' : '') + '>' + esc(v) + '</td>').join('') + '</tr>').join('')
          : '<tr><td class="empty" colspan="' + head.length + '">(nenhuma linha)</td></tr>') +
        '</tbody></table>';
    }).join('') + '</div>';
  }

  // A base de dados de uma lição, mostrada antes dos exemplos.
  function dbHtml(db) {
    let id = 0;
    const html = Object.entries(db).map(([name, spec]) => {
      const table = makeTable(spec, () => ++id);
      return tableHtml(name, table, table, null);
    }).join('');
    return '<div class="db-tables">' + html + '</div>' +
      '<details><summary>Ver o SQL que cria estas tabelas</summary><div class="det-body"><pre class="snip"><code>' + esc(dbToSql(db)) + '</code></pre></div></details>';
  }

  return {
    panelsHtml() {
      return '<div class="panel"><div class="panel-label"><span>Base de dados</span><span>amarelo = mudou agora</span></div><div class="mem db"></div></div>' +
        '<div class="panel"><div class="panel-label"><span>Resultado</span></div><div class="mem res"></div></div>';
    },
    render(host, step, prev) {
      host.querySelector('.db').innerHTML = tablesHtml(step.tables, prev ? prev.tables : null, step.tmarks);
      host.querySelector('.res').innerHTML = gridHtml(step.grid, step.err);
    },
    outputHtml,
    dbHtml,
  };
})();

if (typeof module !== 'undefined') module.exports = { dbToSql, cellText };

</script>
<script>
// ===== Motor do visualizador: transforma a lista de passos de um exemplo em fotografias da memória. =====
// É partilhado por todos os cursos e corre tanto na página como nos testes (shared/check.js).
function parseVarPath(key) {
  const m = key.match(/^([A-Za-z_]\w*)(.*)$/);
  if (!m) throw new Error('caminho inválido: ' + key);
  const path = [];
  const re = /\[(\d+)\]|\.([A-Za-z_]\w*)/g;
  let t;
  let consumed = 0;
  while ((t = re.exec(m[2]))) {
    path.push(t[1] !== undefined ? Number(t[1]) : t[2]);
    consumed += t[0].length;
  }
  if (consumed !== m[2].length) throw new Error('caminho inválido: ' + key);
  return { name: m[1], path };
}

// ---------- tabelas (cursos de SQL) ----------
// Uma coluna escreve-se como no CREATE TABLE: ['numero', 'INTEGER PRIMARY KEY'] ou ['curso', 'INTEGER REFERENCES cursos(id)'].
function parseColumn(spec) {
  const [name, def] = spec;
  const fk = /REFERENCES\s+(\w+)\s*\((\w+)\)/i.exec(def);
  return {
    name,
    def,
    type: def.split(/\s+/)[0].toUpperCase(),
    pk: /PRIMARY\s+KEY/i.test(def),
    fk: fk ? fk[1] + '.' + fk[2] : null,
  };
}

// Transforma { cols, key?, rows? } numa tabela do motor. Cada linha leva um id interno,
// para o visualizador saber que linha é qual mesmo depois de outras serem apagadas.
function makeTable(spec, nextId) {
  const cols = spec.cols.map(parseColumn);
  (spec.key || []).forEach(k => {
    const col = cols.find(c => c.name === k);
    if (!col) throw new Error('chave com coluna inexistente: ' + k);
    col.pk = true;
  });
  const table = { cols, rows: [] };
  (spec.rows || []).forEach(cells => addRow(table, cells, nextId));
  return table;
}

function addRow(table, cells, nextId) {
  if (cells.length !== table.cols.length) throw new Error('linha com ' + cells.length + ' valores numa tabela com ' + table.cols.length + ' colunas');
  table.rows.push({ id: nextId(), cells: cells.slice() });
}

// Aplica as operações de tabelas de um passo: create, ins, upd, del, drop.
function applyTableOps(tables, s, where, nextId) {
  const find = name => {
    if (!tables[name]) throw new Error('tabela inexistente: ' + name + where);
    return tables[name];
  };
  if (s.create) {
    for (const [name, spec] of Object.entries(s.create)) {
      if (tables[name]) throw new Error('tabela repetida: ' + name + where);
      tables[name] = makeTable(spec, nextId);
    }
  }
  if (s.ins) {
    for (const [name, rows] of Object.entries(s.ins)) rows.forEach(cells => addRow(find(name), cells, nextId));
  }
  if (s.upd) {
    for (const [name, changes] of Object.entries(s.upd)) {
      const t = find(name);
      for (const [index, sets] of Object.entries(changes)) {
        const row = t.rows[Number(index)];
        if (!row) throw new Error('linha inexistente: ' + name + '[' + index + ']' + where);
        for (const [col, value] of Object.entries(sets)) {
          const c = t.cols.findIndex(x => x.name === col);
          if (c < 0) throw new Error('coluna inexistente: ' + name + '.' + col + where);
          row.cells[c] = value;
        }
      }
    }
  }
  if (s.del) {
    for (const [name, indexes] of Object.entries(s.del)) {
      const t = find(name);
      indexes.forEach(i => { if (!t.rows[i]) throw new Error('apagar linha inexistente: ' + name + '[' + i + ']' + where); });
      t.rows = t.rows.filter((_, i) => !indexes.includes(i));
    }
  }
  if (s.drop) s.drop.forEach(name => { find(name); delete tables[name]; });
  // tm: marcas que só valem neste passo, por exemplo as linhas que o WHERE de um UPDATE encontrou.
  if (s.tm) {
    for (const [name, marks] of Object.entries(s.tm)) {
      const t = find(name);
      Object.keys(marks).forEach(i => { if (!t.rows[i]) throw new Error('marca em linha inexistente: ' + name + '[' + i + ']' + where); });
    }
  }
}

// g: a grelha de trabalho de uma consulta (o que o FROM, o WHERE, o GROUP BY... já construíram).
function checkGrid(g, where) {
  if (g === null) return;
  if (!Array.isArray(g.cols) || !Array.isArray(g.rows)) throw new Error('grelha sem cols ou rows' + where);
  g.rows.forEach(r => { if (r.length !== g.cols.length) throw new Error('linha da grelha com ' + r.length + ' valores e ' + g.cols.length + ' colunas' + where); });
  if (g.marks && g.marks.length !== g.rows.length) throw new Error('marks da grelha com tamanho diferente das linhas' + where);
  if (g.groups && g.groups.reduce((a, b) => a + b, 0) !== g.rows.length) throw new Error('groups da grelha não somam o número de linhas' + where);
}

// ---------- referências e objetos (cursos de Python, C#, ...) ----------
// Um valor que começa por @ é uma referência para um objeto do heap: '@o1'.
const isRef = v => typeof v === 'string' && v.charAt(0) === '@';

// Todas as referências que um valor contém (o próprio valor, os elementos de uma lista, os campos de um objeto).
function refsIn(value) {
  if (isRef(value)) return [value.slice(1)];
  if (Array.isArray(value)) return value.flatMap(refsIn);
  if (value && typeof value === 'object') return Object.values(value).flatMap(refsIn);
  return [];
}

// Os objetos a que já ninguém chega, partindo dos nomes de todos os frames.
function unreachable(frames, heap) {
  const seen = new Set();
  const visit = id => {
    if (seen.has(id) || !heap[id]) return;
    seen.add(id);
    refsIn(heap[id].value).forEach(visit);
  };
  frames.forEach(f => f.vars.forEach(v => refsIn(v.value).forEach(visit)));
  return Object.keys(heap).filter(id => !seen.has(id));
}

// initialTables: a base de dados com que o exemplo começa ({ nome: { cols, rows } }), ou nada.
function buildSteps(raw, initialTables) {
  let frames = [];
  let out = '';
  let lastId = 0;
  const nextId = () => ++lastId;
  let tables = {};
  for (const [name, spec] of Object.entries(initialTables || {})) tables[name] = makeTable(spec, nextId);
  let grid = null;
  // heap: os objetos ({ id: { type, value } }). Um objeto sem nomes aparece desbotado num passo e desaparece no seguinte.
  let heap = {};
  let orphans = [];
  // acts: as ações feitas na página até aqui (cliques, texto escrito), para o visualizador as repetir.
  let acts = [];
  const res = [];
  raw.forEach((s, idx) => {
    frames = JSON.parse(JSON.stringify(frames));
    tables = JSON.parse(JSON.stringify(tables));
    heap = JSON.parse(JSON.stringify(heap));
    orphans.forEach(id => { delete heap[id]; });
    const where = ' (passo ' + (idx + 1) + ')';
    applyTableOps(tables, s, where, nextId);
    if (s.act) acts = acts.concat([s.act]);
    // obj: cria ou muda objetos: { o1: ['list', ['@o2', 3]] }
    if (s.obj) {
      for (const [id, spec] of Object.entries(s.obj)) heap[id] = { type: spec[0], value: JSON.parse(JSON.stringify(spec[1])) };
    }
    if (s.g !== undefined) {
      checkGrid(s.g, where);
      grid = JSON.parse(JSON.stringify(s.g));
    }
    const findFrame = name => {
      for (let i = frames.length - 1; i >= 0; i--) if (frames[i].name === name) return frames[i];
      throw new Error('frame inexistente: ' + name + where);
    };
    if (s.pop) {
      if (!frames.length) throw new Error('pop sem frames' + where);
      frames.pop();
    }
    if (s.push) frames.push({ name: s.push, vars: [] });
    if (s.x) {
      for (const [fn, names] of Object.entries(s.x)) {
        const f = findFrame(fn);
        names.forEach(n => {
          if (!f.vars.some(v => v.name === n)) throw new Error('apagar variável inexistente: ' + n + where);
        });
        f.vars = f.vars.filter(v => !names.includes(v.name));
      }
    }
    if (s.d) {
      for (const [fn, vars] of Object.entries(s.d)) {
        const f = findFrame(fn);
        for (const [name, spec] of Object.entries(vars)) {
          if (f.vars.some(v => v.name === name)) throw new Error('variável repetida: ' + name + where);
          const [type, value, addr] = spec;
          f.vars.push({ name, type, value: JSON.parse(JSON.stringify(value)), addr: addr || null });
        }
      }
    }
    if (s.u) {
      for (const [fn, sets] of Object.entries(s.u)) {
        const f = findFrame(fn);
        for (const [key, value] of Object.entries(sets)) {
          const { name, path } = parseVarPath(key);
          const v = f.vars.find(x => x.name === name);
          if (!v) throw new Error('atualizar variável inexistente: ' + name + where);
          if (!path.length) { v.value = value; continue; }
          let target = v.value;
          for (let i = 0; i < path.length - 1; i++) {
            target = target[path[i]];
            if (target === undefined) throw new Error('caminho inexistente: ' + key + where);
          }
          const last = path[path.length - 1];
          if (target[last] === undefined) throw new Error('caminho inexistente: ' + key + where);
          target[last] = value;
        }
      }
    }
    if (s.o) out += s.o;
    // Todas as referências têm de apontar para objetos que existem.
    const allValues = frames.flatMap(f => f.vars.map(v => v.value)).concat(Object.values(heap).map(o => o.value));
    allValues.flatMap(refsIn).forEach(id => { if (!heap[id]) throw new Error('referência para um objeto inexistente: @' + id + where); });
    orphans = unreachable(frames, heap);
    // sel, box, chk e width são do curso de HTML: o visualizador da página lê-os de cada passo.
    res.push({ l: s.l, frames, out, n: s.n || '', tables, tmarks: s.tm || {}, grid, err: s.err || '', heap, orphans, sel: s.sel || null, box: s.box || null, width: s.width || null, acts });
  });
  return res;
}

if (typeof module !== 'undefined') module.exports = { buildSteps, parseVarPath, makeTable };

</script>
<script>
// ===== SQL do Zero — conteúdo das lições (parte 1) =====
// Formato de um passo do visualizador (l e n são como no C):
//   create: { tabela: { cols: [[nome, definição]], key?: [colunas] } }   cria uma tabela vazia
//   ins:    { tabela: [[valores], ...] }               acrescenta linhas
//   upd:    { tabela: { índice: { coluna: valor } } }  muda células (índice 0 = primeira linha)
//   del:    { tabela: [índices] }                      apaga linhas
//   tm:     { tabela: { índice: 'hit' | 'drop' } }     marca linhas da base de dados só neste passo
//   g:      { label, cols, rows, marks?, groups? } ou null   a grelha de trabalho da consulta (painel Resultado)
//           marks: 'keep' (passa), 'drop' (fica de fora), 'hit' (em destaque); groups: tamanhos dos grupos
//   err:    'mensagem'                                 o SQLite deu erro nesta instrução
// Um exemplo com db começa com essas tabelas. O check corre cada instrução no SQLite e compara,
// no último passo dessa instrução, as tabelas e o resultado com os reais.
const C = (s, ...v) => String.raw(s, ...v).replace(/^\n/, '').replace(/\n\s*$/, '');
const H = (s, ...v) => String.raw(s, ...v);

// ---------- ajudantes para escrever grelhas e resultados ----------
// Nomes das colunas de uma tabela de exemplo.
const colsOf = t => t.cols.map(c => c[0]);
// Uma linha como objeto, para escrever condições legíveis: a => a.nota >= 10
const asObj = (t, r) => Object.fromEntries(colsOf(t).map((c, i) => [c, r[i]]));
// As linhas que cumprem uma condição, e as marcas 'keep'/'drop' que mostram o WHERE a trabalhar.
const rowsWhere = (t, test) => t.rows.filter(r => test(asObj(t, r)));
const marksWhere = (t, test) => t.rows.map(r => (test(asObj(t, r)) ? 'keep' : 'drop'));
// Só algumas colunas das linhas dadas (é o que o SELECT faz).
const pick = (t, rows, names) => rows.map(r => names.map(n => r[colsOf(t).indexOf(n)]));
// Um resultado em texto, como o sqlite3 o mostra com .headers on: res(['nome'], [['Ana'], ['Rui']]).
const res = (cols, rows) => [cols.join('|')].concat(rows.map(r => r.map(v => (v === null ? 'NULL' : String(v))).join('|'))).join('\n');
// O mesmo, com a mudança de linha final (para o "Resultado esperado" dos exercícios).
const out = (cols, rows) => res(cols, rows) + '\n';
// Uma base de dados só com algumas tabelas de outra: only(ESCOLA, 'alunos', 'cursos').
const only = (db, ...names) => Object.fromEntries(names.map(n => [n, db[n]]));

// ---------- bases de dados das lições ----------
const ALUNOS = {
  cols: [['numero', 'INTEGER PRIMARY KEY'], ['nome', 'TEXT NOT NULL'], ['curso', 'TEXT'], ['ano', 'INTEGER'], ['nota', 'INTEGER']],
  rows: [
    [101, 'Ana', 'LEI', 1, 17],
    [102, 'Rui', 'LEI', 1, 9],
    [103, 'Ines', 'LEE', 2, 14],
    [104, 'Tiago', 'LEI', 2, 12],
    [105, 'Marta', 'LEM', 1, 18],
    [106, 'Pedro', 'LEE', 1, 7],
    [107, 'Sofia', 'LEI', 1, 15],
    [108, 'Joao', 'LEM', 2, 11],
  ],
};
const ALL = colsOf(ALUNOS);

const LESSONS = [];

// ---------------------------------------------------------------- 0
LESSONS.push({
  id: 0,
  title: 'Tabelas e o primeiro SELECT',
  short: 'linhas, colunas e pedir dados com SELECT ... FROM',
  body: H`
<p>Uma <strong>base de dados</strong> guarda a informação em <strong>tabelas</strong>. Cada tabela tem <strong>colunas</strong> (que informação se guarda: número, nome, nota) e <strong>linhas</strong> (um registo cada: um aluno). Em C fazias isto com um array de structs: cada struct era uma linha, cada campo era uma coluna.</p>
<p>Para pedir dados escreve-se em <strong>SQL</strong>. A grande diferença para o C: em SQL dizes <strong>o que queres</strong>, não <strong>como</strong> se faz. Não há <code>for</code> a percorrer as linhas; é o sistema de gestão de base de dados (SGBD) que trata disso.</p>
<pre class="snip"><code>SELECT colunas
FROM tabela;</code></pre>
<ul>
<li><code>FROM alunos</code> diz de que tabela vêm os dados; <code>SELECT nome, nota</code> diz que colunas queres ver. <code>SELECT *</code> mostra todas.</li>
<li>Podes fazer contas nas colunas (<code>nota * 5</code>) e dar-lhes um nome novo com <code>AS</code>.</li>
<li>A instrução acaba com <code>;</code>. As palavras do SQL tanto podem ir em maiúsculas como em minúsculas, mas é costume escrevê-las em maiúsculas.</li>
<li>Repara na ordem: escreve-se <code>SELECT</code> primeiro, mas o SGBD começa pelo <code>FROM</code>. Só depois de ter a tabela é que escolhe as colunas.</li>
</ul>`,

      { l: 1, g: { label: 'SELECT nome, nota', cols: ['nome', 'nota'], rows: pick(ALUNOS, ALUNOS.rows, ['nome', 'nota']) }, n: H`Depois o <code>SELECT</code> fica só com as colunas pedidas, pela ordem em que as escreveste. As linhas continuam a ser todas, porque não pedimos nenhum filtro.` },

  mistakes: [

      exp: H`Tal como em C, inteiro a dividir por inteiro dá inteiro: <code>10 / 4</code> dá 2 (as casas decimais são cortadas). Basta um dos lados ser real (<code>4.0</code>) para dar 2.5.` },

    { q: 'Quantas linhas dá SELECT nome FROM alunos; com a tabela desta lição?', opts: ['1', '5', '8', '40'], ok: 2,

LESSONS.push({
  id: 1,
  title: 'Criar tabelas e inserir dados',
  short: 'CREATE TABLE, tipos, NOT NULL e INSERT INTO',
  body: H`
<p>Antes de ter dados é preciso criar a tabela: dizer que colunas tem e de que tipo é cada uma. É parecido com definir um <code>struct</code> em C: crias o molde, ainda sem nenhuma linha.</p>
<pre class="snip"><code>CREATE TABLE alunos (
    numero INTEGER PRIMARY KEY,
    nome TEXT NOT NULL,
    nota INTEGER
);</code></pre>
<table class="t">
<thead><tr><th>Tipo (SQLite)</th><th>Guarda</th><th>Em C era</th></tr></thead>
<tbody>
<tr><td><code>INTEGER</code></td><td>números inteiros</td><td><code>int</code></td></tr>
<tr><td><code>REAL</code></td><td>números com casas decimais</td><td><code>double</code></td></tr>
<tr><td><code>TEXT</code></td><td>texto, escrito entre plicas: <code>'Ana'</code></td><td><code>char[]</code></td></tr>
</tbody>
</table>
<ul>
<li><code>NOT NULL</code> obriga a coluna a ter sempre um valor. <code>PRIMARY KEY</code> diz que a coluna identifica cada linha: não se pode repetir (vês isto a fundo na lição 8).</li>
<li><code>INSERT INTO alunos VALUES (101, 'Ana', 17);</code> acrescenta uma linha. Os valores vão pela ordem das colunas.</li>
<li>Se só deres algumas colunas, escreve-as: <code>INSERT INTO alunos (numero, nome) VALUES (102, 'Rui');</code>. As que faltam ficam com <code>NULL</code> (sem valor).</li>
<li>Um só INSERT pode meter várias linhas: <code>VALUES (...), (...);</code></li>
</ul>
<p>Noutros SGBD (MySQL, PostgreSQL, Oracle) os nomes dos tipos mudam um pouco (<code>INT</code>, <code>VARCHAR(50)</code>, <code>DECIMAL</code>), mas a ideia é a mesma.</p>`,
  analogy: H`O <code>CREATE TABLE</code> é desenhar as colunas numa folha de pauta em branco. Cada <code>INSERT</code> é escrever uma linha nessa folha. As regras (<code>NOT NULL</code>, <code>PRIMARY KEY</code>) são o funcionário que recusa uma linha mal preenchida.`,
  examples: [{
    title: 'Criar a tabela e pôr lá alunos',
    code: C`
CREATE TABLE alunos (
    numero INTEGER PRIMARY KEY,
    nome TEXT NOT NULL,
    nota INTEGER
);
INSERT INTO alunos VALUES (101, 'Ana', 17);
INSERT INTO alunos (numero, nome) VALUES (102, 'Rui');
INSERT INTO alunos VALUES (103, 'Ines', 14), (104, 'Tiago', 12);
SELECT * FROM alunos;`,
    steps: [
      { l: 1, create: { alunos: { cols: [['numero', 'INTEGER PRIMARY KEY'], ['nome', 'TEXT NOT NULL'], ['nota', 'INTEGER']] } }, n: H`<code>CREATE TABLE</code> cria a tabela <code>alunos</code>, ainda sem nenhuma linha. A base de dados passa a ter uma tabela.` },
      { l: 2, n: H`<code>numero</code> é um inteiro e é a <strong>chave primária</strong> (PK): cada aluno tem um número diferente.` },
      { l: 3, n: H`<code>nome</code> é texto e <code>NOT NULL</code>: não pode ficar vazio.` },
      { l: 4, n: H`<code>nota</code> é um inteiro sem regras extra: pode ficar sem valor.` },
      { l: 6, ins: { alunos: [[101, 'Ana', 17]] }, n: H`O <code>INSERT</code> acrescenta uma linha. Os três valores vão pela ordem das colunas: numero, nome, nota. O texto vai entre plicas.` },
      { l: 7, ins: { alunos: [[102, 'Rui', null]] }, n: H`Aqui só se dão duas colunas, escritas entre parênteses. A <code>nota</code> fica com <code>NULL</code>: não tem valor (não é zero!).` },
      { l: 8, ins: { alunos: [[103, 'Ines', 14], [104, 'Tiago', 12]] }, n: 'Um só INSERT com duas linhas, separadas por vírgula.' },
      { l: 9, g: { label: 'SELECT * FROM alunos', cols: ['numero', 'nome', 'nota'], rows: [[101, 'Ana', 17], [102, 'Rui', null], [103, 'Ines', 14], [104, 'Tiago', 12]] }, n: H`<code>SELECT *</code> mostra todas as colunas e todas as linhas. Lá está o <code>NULL</code> do Rui.` },
    ],
  }, {
    title: 'Quando o INSERT é recusado',
    code: C`
CREATE TABLE alunos (
    numero INTEGER PRIMARY KEY,
    nome TEXT NOT NULL
);
INSERT INTO alunos VALUES (101, 'Ana');
INSERT INTO alunos VALUES (101, 'Rui');
INSERT INTO alunos VALUES (102, NULL);
INSERT INTO alunos VALUES (102, 'Rui');`,
    steps: [
      { l: 1, create: { alunos: { cols: [['numero', 'INTEGER PRIMARY KEY'], ['nome', 'TEXT NOT NULL']] } }, n: 'Uma tabela com duas regras: o número não se repete e o nome é obrigatório.' },
      { l: 5, ins: { alunos: [[101, 'Ana']] }, n: 'A Ana entra sem problemas.' },
      { l: 6, err: 'UNIQUE constraint failed: alunos.numero', n: H`O 101 já existe e o <code>numero</code> é chave primária. O SQLite recusa a linha inteira: a tabela fica igual.` },
      { l: 7, err: 'NOT NULL constraint failed: alunos.nome', n: H`O nome é <code>NOT NULL</code>, por isso também esta é recusada.` },
      { l: 8, ins: { alunos: [[102, 'Rui']] }, n: 'Com um número novo e um nome, o Rui já entra. Uma instrução recusada não estraga as outras.' },
    ],
  }],
  mistakes: [
    H`Escrever texto com aspas: <code>"Ana"</code>. Em SQL o texto vai entre <strong>plicas</strong>: <code>'Ana'</code>. O SQLite queixa-se com <em>no such column: "Ana"</em>.`,
    H`Esquecer as plicas no texto: <code>VALUES (101, Ana)</code>. O SQL acha que <code>Ana</code> é o nome de uma coluna.`,
    H`Dar menos valores do que as colunas sem dizer quais são: <em>table alunos has 3 columns but 2 values were supplied</em>.`,
    H`Esquecer o <code>;</code> entre instruções, ou a vírgula entre colunas no CREATE TABLE.`,
    H`Criar a tabela duas vezes: <em>table alunos already exists</em>.`,
    H`Pôr uma vírgula depois da última coluna do CREATE TABLE, antes do <code>)</code>.`,
  ],
  quiz: [
    { q: 'Que resultado dá este script?', db: false, code: C`
CREATE TABLE t (a INTEGER, b TEXT);
INSERT INTO t VALUES (1, 'x');
INSERT INTO t (b) VALUES ('y');
SELECT * FROM t;`, opts: [res(['a', 'b'], [[1, 'x'], [null, 'y']]), res(['a', 'b'], [[1, 'x'], [0, 'y']]), res(['a', 'b'], [[1, 'x']]), 'Erro: NOT NULL constraint failed: t.a'], ok: 0, mono: true, check: true,
      exp: H`A coluna <code>a</code> não foi dada no segundo INSERT, por isso fica <code>NULL</code> (sem valor, que não é o mesmo que 0). Não há erro porque <code>a</code> não tem <code>NOT NULL</code>.` },
    { q: 'Que resultado dá este script?', db: false, code: C`
CREATE TABLE t (n INTEGER PRIMARY KEY, nome TEXT);
INSERT INTO t VALUES (1, 'Ana');
INSERT INTO t VALUES (1, 'Rui');
SELECT nome FROM t;`, opts: [res(['nome'], [['Ana'], ['Rui']]), res(['nome'], [['Rui']]), 'Erro: UNIQUE constraint failed: t.n\n\n' + res(['nome'], [['Ana']]), res(['nome'], [['Ana']])], ok: 2, mono: true, check: true,
      exp: H`O segundo INSERT repete a chave primária, por isso dá erro e o Rui não entra. O SQLite continua para a instrução seguinte, e o SELECT só encontra a Ana.` },
    { q: 'Que tipo usas para guardar o nome de um aluno?', opts: ['INTEGER', 'REAL', 'TEXT', 'NAME'], ok: 2,
      exp: H`Texto guarda-se em <code>TEXT</code>. <code>INTEGER</code> e <code>REAL</code> são para números.` },
    { q: 'Qual destes INSERT está certo?', opts: ["INSERT INTO alunos VALUES (105, 'Marta', 18);", 'INSERT INTO alunos VALUES (105, "Marta", 18);', "INSERT alunos VALUES (105, 'Marta', 18);", "INSERT INTO alunos (105, 'Marta', 18);"], ok: 0, mono: true,
      exp: H`É <code>INSERT INTO tabela VALUES (...)</code>, com o texto entre plicas. Com aspas o SQLite procura uma coluna chamada Marta, sem <code>INTO</code> é erro de sintaxe e sem <code>VALUES</code> os valores são lidos como nomes de colunas.` },
  ],
  exercises: [{
    title: 'Tabela de UCs',
    text: 'Cria a tabela ucs com as colunas codigo (texto, chave primária), nome (texto, obrigatório) e ects (inteiro). Insere as UCs BD "Bases de Dados" com 6 ECTS, SO "Sistemas Operativos" com 6 e RC "Redes de Computadores" com 4. No fim mostra a tabela toda.',
    run: out(['codigo', 'nome', 'ects'], [['BD', 'Bases de Dados', 6], ['SO', 'Sistemas Operativos', 6], ['RC', 'Redes de Computadores', 4]]),
    hint: H`Primeiro o <code>CREATE TABLE ucs (...)</code>, com as colunas separadas por vírgula. Depois um INSERT (ou três) e um <code>SELECT * FROM ucs;</code>`,
    solution: C`
CREATE TABLE ucs (
    codigo TEXT PRIMARY KEY,
    nome TEXT NOT NULL,
    ects INTEGER
);
INSERT INTO ucs VALUES
    ('BD', 'Bases de Dados', 6),
    ('SO', 'Sistemas Operativos', 6),
    ('RC', 'Redes de Computadores', 4);
SELECT * FROM ucs;`,
  }, {
    title: 'Livros',
    text: 'Cria a tabela livros com id (inteiro, chave primária), titulo (texto, obrigatório) e ano (inteiro). Insere Os Maias (1888), Mensagem (1934) e Ensaio sobre a Cegueira (1995), com os ids 1, 2 e 3. Mostra só o título e o ano.',
    run: out(['titulo', 'ano'], [['Os Maias', 1888], ['Mensagem', 1934], ['Ensaio sobre a Cegueira', 1995]]),
    hint: H`No fim não uses <code>*</code>: escreve as duas colunas que queres, <code>SELECT titulo, ano</code>.`,
    solution: C`
CREATE TABLE livros (
    id INTEGER PRIMARY KEY,
    titulo TEXT NOT NULL,
    ano INTEGER
);
INSERT INTO livros VALUES (1, 'Os Maias', 1888), (2, 'Mensagem', 1934), (3, 'Ensaio sobre a Cegueira', 1995);
SELECT titulo, ano FROM livros;`,
  }],
});

const positiva = a => a.nota >= 10;
const leiPrimeiro = a => a.curso === 'LEI' && a.ano === 1;

LESSONS.push({
  id: 2,
  title: 'Filtrar linhas com WHERE',
  short: 'condições, AND e OR, BETWEEN, IN e LIKE',
  body: H`
<p>O <code>WHERE</code> escolhe <strong>que linhas</strong> ficam no resultado. A condição é testada linha a linha: as que dão verdadeiro passam, as outras ficam de fora. A ordem de trabalho é <code>FROM</code> → <code>WHERE</code> → <code>SELECT</code>.</p>
<table class="t">
<thead><tr><th>Escreves</th><th>Quer dizer</th></tr></thead>
<tbody>
<tr><td><code>nota = 10</code></td><td>igual (só um <code>=</code>, ao contrário do C)</td></tr>
<tr><td><code>nota &lt;&gt; 10</code> ou <code>nota != 10</code></td><td>diferente</td></tr>
<tr><td><code>&lt; &gt; &lt;= &gt;=</code></td><td>menor, maior, ...</td></tr>
<tr><td><code>AND</code>, <code>OR</code>, <code>NOT</code></td><td>e, ou, não (como <code>&amp;&amp;</code>, <code>||</code> e <code>!</code> em C)</td></tr>
<tr><td><code>nota BETWEEN 10 AND 14</code></td><td>entre 10 e 14, <strong>incluindo</strong> os dois</td></tr>
<tr><td><code>curso IN ('LEI', 'LEM')</code></td><td>igual a um destes</td></tr>
<tr><td><code>nome LIKE 'M%'</code></td><td>começa por M (<code>%</code> = qualquer texto, <code>_</code> = um carácter)</td></tr>
</tbody>
</table>
<p>O texto vai entre plicas e, com <code>=</code>, as maiúsculas contam: <code>'lei'</code> não é <code>'LEI'</code>. Quando juntas <code>AND</code> e <code>OR</code>, usa parênteses para não haver dúvidas.</p>`,
  analogy: 'O WHERE é uma peneira. As linhas da tabela passam uma a uma e só ficam as que cumprem a condição. A tabela original não perde nada: a peneira só decide o que vai para o resultado.',
  db: { alunos: ALUNOS },
  examples: [{
    title: 'Quem teve positiva',
    db: { alunos: ALUNOS },
    code: C`
SELECT nome, nota
FROM alunos
WHERE nota >= 10;`,
    steps: [
      { l: 2, g: { label: 'FROM alunos', cols: ALL, rows: ALUNOS.rows }, n: H`Primeiro o <code>FROM</code>: a tabela inteira, 8 linhas.` },
      { l: 3, g: { label: 'WHERE nota >= 10', cols: ALL, rows: ALUNOS.rows, marks: marksWhere(ALUNOS, positiva) }, n: H`O <code>WHERE</code> testa cada linha: 17 &gt;= 10 sim, 9 &gt;= 10 não, ... A verde as que passam, riscadas as que ficam de fora (o Rui e o Pedro).` },
      { l: 1, g: { label: 'SELECT nome, nota', cols: ['nome', 'nota'], rows: pick(ALUNOS, rowsWhere(ALUNOS, positiva), ['nome', 'nota']) }, n: H`Só no fim o <code>SELECT</code> escolhe as colunas, e só das 6 linhas que passaram.` },
    ],
  }, {
    title: 'Duas condições com AND',
    db: { alunos: ALUNOS },
    code: C`
SELECT nome, curso, ano
FROM alunos
WHERE curso = 'LEI' AND ano = 1;`,
    steps: [
      { l: 2, g: { label: 'FROM alunos', cols: ALL, rows: ALUNOS.rows }, n: 'A tabela inteira.' },
      { l: 3, g: { label: "WHERE curso = 'LEI' AND ano = 1", cols: ALL, rows: ALUNOS.rows, marks: marksWhere(ALUNOS, leiPrimeiro) }, n: H`Com <code>AND</code> têm de ser verdade as duas. O Tiago é de LEI mas está no 2.º ano, por isso fica de fora. A Marta está no 1.º ano mas é de LEM.` },
      { l: 1, g: { label: 'SELECT nome, curso, ano', cols: ['nome', 'curso', 'ano'], rows: pick(ALUNOS, rowsWhere(ALUNOS, leiPrimeiro), ['nome', 'curso', 'ano']) }, n: 'Ficam três alunos: os de LEI do 1.º ano.' },
    ],
  }],
  mistakes: [
    H`Escrever o texto sem plicas: <code>WHERE curso = LEI</code> dá <em>no such column: LEI</em>.`,
    H`Escrever <code>WHERE 'curso' = 'LEI'</code>: com plicas, <code>'curso'</code> é texto e não a coluna, e o texto "curso" nunca é igual a "LEI". Não dá erro, mas o resultado vem vazio.`,
    H`Confundir <code>AND</code> com <code>OR</code>. "Alunos de LEI e de LEM" é <code>curso = 'LEI' OR curso = 'LEM'</code> (ou <code>IN</code>): nenhum aluno é dos dois cursos ao mesmo tempo.`,
    H`Escrever <code>WHERE nota &gt;= 10 AND &lt;= 14</code>. Cada lado do AND é uma condição completa: <code>nota &gt;= 10 AND nota &lt;= 14</code>, ou <code>BETWEEN 10 AND 14</code>.`,
    H`Esquecer que o <code>BETWEEN</code> inclui os extremos.`,
  ],
  quiz: [
    { q: 'Que resultado dá esta consulta?', code: C`
SELECT nome FROM alunos
WHERE nota > 15;`, opts: [res(['nome'], [['Ana'], ['Marta']]), res(['nome'], [['Ana'], ['Marta'], ['Sofia']]), res(['nome'], [['Marta']]), res(['nome'], [['Marta'], ['Ana']])], ok: 0, mono: true, check: true,
      exp: H`Só passam as notas maiores do que 15: 17 (Ana) e 18 (Marta). A Sofia tem 15, e 15 &gt; 15 é falso. As linhas aparecem pela ordem da tabela, porque não pedimos outra.` },
    { q: 'Que resultado dá esta consulta?', code: C`
SELECT nome FROM alunos
WHERE curso = 'LEE' OR nota < 10;`, opts: [res(['nome'], [['Pedro']]), res(['nome'], [['Rui'], ['Ines'], ['Pedro']]), res(['nome'], [['Ines'], ['Pedro'], ['Rui']]), res(['nome'], [['Rui'], ['Ines'], ['Pedro'], ['Pedro']])], ok: 1, mono: true, check: true,
      exp: H`Com <code>OR</code> basta uma das condições: a Ines é de LEE, o Rui tem 9 e o Pedro cumpre as duas. Cada linha aparece uma só vez, mesmo que cumpra as duas condições. Só o Pedro seria a resposta com <code>AND</code>.` },
    { q: 'Que resultado dá esta consulta?', code: C`
SELECT nome FROM alunos
WHERE nota BETWEEN 12 AND 15;`, opts: [res(['nome'], [['Ines']]), res(['nome'], [['Ines'], ['Tiago'], ['Sofia']]), res(['nome'], [['Tiago'], ['Ines'], ['Sofia']]), res(['nome'], [['Ines'], ['Sofia']])], ok: 1, mono: true, check: true,
      exp: H`O <code>BETWEEN</code> inclui os extremos: 14 (Ines), 12 (Tiago) e 15 (Sofia) passam. Saem pela ordem da tabela, não por nota.` },
    { q: 'Que resultado dá esta consulta?', code: C`
SELECT nome FROM alunos
WHERE nome LIKE '%a';`, opts: [res(['nome'], [['Ana']]), res(['nome'], [['Ana'], ['Marta'], ['Sofia']]), res(['nome'], [['Marta'], ['Sofia']]), res(['nome'], [['Ana'], ['Marta'], ['Sofia'], ['Joao']])], ok: 1, mono: true, check: true,
      exp: H`<code>'%a'</code> é "qualquer coisa e depois um a no fim": Ana, Marta e Sofia. <code>'A%'</code> seria "começa por A".` },

<li><code>SELECT DISTINCT curso</code> tira as linhas repetidas do resultado.</li>
</ul>
<p>A ordem de trabalho fica assim: <code>FROM</code> → <code>WHERE</code> → <code>SELECT</code> → <code>DISTINCT</code> → <code>ORDER BY</code> → <code>LIMIT</code>.</p>`,

LESSONS.push({
  id: 4,
  title: 'Mudar e apagar: UPDATE e DELETE',
  short: 'SET, o WHERE que não se pode esquecer, e testar antes',
  body: H`
<p>O <code>UPDATE</code> muda valores de linhas que já existem e o <code>DELETE</code> apaga linhas. Os dois usam um <code>WHERE</code> para escolher <strong>que linhas</strong> são afetadas, exatamente como no SELECT.</p>
<pre class="snip"><code>UPDATE alunos
SET nota = nota + 1
WHERE numero = 102;

DELETE FROM alunos
WHERE nota &lt; 10;</code></pre>
<ul>
<li>No <code>SET</code>, o lado direito pode usar o valor atual: <code>nota = nota + 1</code> funciona como <code>x = x + 1</code> em C. Para mudar várias colunas, separa-as com vírgulas: <code>SET curso = 'LEI', ano = 2</code>.</li>
<li><strong>Sem WHERE, o UPDATE muda todas as linhas e o DELETE apaga todas as linhas.</strong> Não há "desfazer".</li>
<li>Um truque seguro: escreve primeiro <code>SELECT * FROM alunos WHERE ...</code> com o mesmo WHERE, confirma que aparecem as linhas certas, e só depois troca o SELECT por UPDATE ou DELETE.</li>
<li><code>DELETE FROM alunos;</code> esvazia a tabela, mas ela continua a existir. Para apagar a própria tabela é <code>DROP TABLE alunos;</code>.</li>
</ul>`,
  analogy: H`O <code>UPDATE</code> é um corretor com caneta: vai às linhas que o <code>WHERE</code> indica, risca o valor antigo e escreve o novo. Se ninguém lhe disser que linhas são, corrige a pauta inteira.`,
  db: { alunos: ALUNOS },
  examples: [{
    title: 'Mudar notas, com e sem WHERE',
    db: { alunos: ALUNOS },
    code: C`
UPDATE alunos
SET nota = nota + 1
WHERE nota = 9;
UPDATE alunos
SET ano = ano + 1;`,
    steps: [
      { l: 1, n: H`<code>UPDATE alunos</code>: vamos mudar linhas da tabela alunos. Ainda não se sabe quais.` },
      { l: 3, tm: { alunos: { 1: 'hit' } }, n: H`O <code>WHERE</code> escolhe as linhas, como num SELECT: só o Rui tem nota 9.` },
      { l: 2, upd: { alunos: { 1: { nota: 10 } } }, n: H`O <code>SET</code> calcula <code>nota + 1</code> com o valor atual (9 + 1) e guarda 10. As outras linhas não mudam.` },
      { l: 4, n: 'Outro UPDATE, também na tabela alunos.' },
      { l: 5, upd: { alunos: Object.fromEntries(comBonus.map((r, i) => [i, { ano: r[3] + 1 }])) }, n: H`Este não tem WHERE, por isso <strong>todas</strong> as linhas mudam: toda a gente subiu um ano. Se fosse um engano, não havia forma de desfazer.` },
    ],
  }, {
    title: 'Apagar quem reprovou',
    db: { alunos: ALUNOS },
    code: C`
DELETE FROM alunos
WHERE nota < 10;
SELECT nome, nota
FROM alunos;`,
    steps: [
      { l: 2, tm: { alunos: { 1: 'drop', 5: 'drop' } }, n: H`O <code>WHERE</code> encontra as linhas a apagar: o Rui (9) e o Pedro (7).` },
      { l: 1, del: { alunos: [1, 5] }, n: H`O <code>DELETE</code> apaga essas duas linhas. A tabela passa a ter 6.` },
      { l: 4, g: { label: 'FROM alunos', cols: ALL, rows: naoApagados }, n: 'Agora um SELECT: a tabela já não tem as linhas apagadas.' },
      { l: 3, g: { label: 'SELECT nome, nota', cols: ['nome', 'nota'], rows: pick(ALUNOS, naoApagados, ['nome', 'nota']) }, n: 'Ficaram 6 alunos, todos com positiva.' },
    ],
  }],
  mistakes: [
    H`Esquecer o <code>WHERE</code> num UPDATE ou DELETE: muda ou apaga a tabela toda.`,
    H`Escrever <code>UPDATE alunos SET nota = 18 AND curso = 'LEI'</code>. Para mudar duas colunas usa-se vírgula: <code>SET nota = 18, curso = 'LEI'</code>.`,
    H`Escrever <code>DELETE nome FROM alunos</code>. O DELETE apaga linhas inteiras; para limpar só um valor faz-se <code>UPDATE ... SET nome = NULL</code>.`,
    H`Confundir <code>DELETE FROM alunos</code> (esvazia a tabela) com <code>DROP TABLE alunos</code> (apaga a tabela).`,
    H`Escolher a linha por um valor que se repete (<code>WHERE nome = 'Ana'</code>) quando havia duas Anas. Para mexer numa só linha, usa a chave primária.`,

  quiz: [

      exp: 'O UPDATE muda a nota da Ana para 20 antes do SELECT correr. Depois, a Ana (20) e a Marta (18) têm nota de 17 ou mais.' },
    { q: 'Que resultado dá este script?', code: C`
UPDATE alunos SET nota = nota + 2;
SELECT nome, nota FROM alunos WHERE nota < 10;`, opts: [res(['nome', 'nota'], [['Rui', 9], ['Pedro', 7]]), res(['nome', 'nota'], [['Rui', 11], ['Pedro', 9]]), res(['nome', 'nota'], [['Pedro', 9]]), res(['nome', 'nota'], [['Pedro', 7]])], ok: 2, mono: true, check: true,

DELETE FROM alunos WHERE curso = 'LEI';

      exp: H`Sem WHERE, todas as linhas passam o filtro e são apagadas. A tabela fica vazia, mas existe: ainda podes fazer INSERT. Quem apaga a tabela é o <code>DROP TABLE</code>.` },
  ],
  exercises: [{
    title: 'Passar de ano',

LESSONS.push({
  id: 5,
  title: 'NULL: o valor que falta',
  short: 'IS NULL, porque é que = NULL nunca dá, e COALESCE',
  body: H`
<p><code>NULL</code> quer dizer "não há valor" ou "não se sabe". Não é zero nem texto vazio: o aluno que faltou ao exame não tem nota 0, tem nota <strong>desconhecida</strong>. Em C, uma variável sem valor tinha lixo; em SQL fica explicitamente <code>NULL</code>.</p>
<ul>
<li>Qualquer comparação com NULL dá "desconhecido", que não é verdadeiro. Por isso <code>WHERE nota = NULL</code> <strong>nunca</strong> encontra nada, e <code>WHERE nota &lt; 10</code> deixa de fora quem tem NULL.</li>
<li>Para perguntar se falta o valor usa-se <code>IS NULL</code>, e para o contrário <code>IS NOT NULL</code>.</li>
<li>Contas com NULL dão NULL: <code>NULL + 1</code> é NULL.</li>
<li><code>COALESCE(nota, 0)</code> devolve a nota, ou 0 se ela for NULL. Serve para trocar o NULL por um valor à escolha.</li>
</ul>`,
  analogy: 'NULL é um "?" escrito na pauta. Se perguntares "a nota dele é menor do que 10?", a resposta não é sim nem não: é "não sei". E o WHERE só deixa passar as linhas cuja resposta é sim.',
  db: { alunos: ALUNOS_NULL },
  examples: [{
    title: 'Quem não tem nota',
    db: { alunos: ALUNOS_NULL },
    code: C`
SELECT nome, nota
FROM alunos
WHERE nota = NULL;
SELECT nome, nota
FROM alunos
WHERE nota IS NULL;`,
    steps: [
      { l: 2, g: { label: 'FROM alunos', cols: ALL_N, rows: ALUNOS_NULL.rows }, n: 'A tabela tem dois alunos sem nota: o Rui e a Marta.' },
      { l: 3, g: { label: 'WHERE nota = NULL', cols: ALL_N, rows: ALUNOS_NULL.rows, marks: ALUNOS_NULL.rows.map(() => 'drop') }, n: H`<code>17 = NULL</code>? Não se sabe. <code>NULL = NULL</code>? Também não se sabe! Nenhuma linha dá verdadeiro, por isso nenhuma passa.` },
      { l: 1, g: { label: 'SELECT nome, nota', cols: ['nome', 'nota'], rows: [] }, n: 'Resultado vazio, e sem nenhum erro. É por isso que este engano é tão traiçoeiro.' },
      { l: 5, g: { label: 'FROM alunos', cols: ALL_N, rows: ALUNOS_NULL.rows }, n: 'Agora da forma certa.' },
      { l: 6, g: { label: 'WHERE nota IS NULL', cols: ALL_N, rows: ALUNOS_NULL.rows, marks: marksWhere(ALUNOS_NULL, semNota) }, n: H`<code>IS NULL</code> pergunta mesmo "falta o valor?", e a resposta é sim ou não.` },
      { l: 4, g: { label: 'SELECT nome, nota', cols: ['nome', 'nota'], rows: pick(ALUNOS_NULL, rowsWhere(ALUNOS_NULL, semNota), ['nome', 'nota']) }, n: 'Aparecem o Rui e a Marta.' },

<thead><tr><th>Função</th><th>Dá</th></tr></thead>
<tbody>
<tr><td><code>COUNT(*)</code></td><td>quantas linhas há</td></tr>
<tr><td><code>COUNT(nota)</code></td><td>quantas linhas têm nota (não conta os NULL)</td></tr>
<tr><td><code>SUM(nota)</code></td><td>a soma</td></tr>
<tr><td><code>AVG(nota)</code></td><td>a média (sempre um número real)</td></tr>
<tr><td><code>MIN(nota)</code>, <code>MAX(nota)</code></td><td>o menor e o maior</td></tr>
</tbody>
</table>

<li>As funções trabalham sobre as linhas que passaram o <code>WHERE</code>. O resultado tem <strong>uma só linha</strong>.</li>

<li>Não podes usá-las no WHERE (<code>WHERE AVG(nota) &gt; 12</code> dá erro). Isso fica para o <code>HAVING</code>, na lição seguinte.</li>

  short: 'uma linha por grupo, e o WHERE contra o HAVING',
  body: H`
<p>Na lição anterior, as funções davam um só valor para a tabela toda. Com <code>GROUP BY curso</code>, as linhas juntam-se em <strong>grupos</strong> (uma por cada curso diferente) e as funções são calculadas <strong>para cada grupo</strong>. O resultado tem uma linha por grupo.</p>
<pre class="snip"><code>SELECT curso, COUNT(*) AS n, AVG(nota) AS media
FROM alunos
GROUP BY curso;</code></pre>
<ul>
<li>No SELECT só deves pôr as colunas do <code>GROUP BY</code> e funções de agregação. Pôr outra coluna (como <code>nome</code>) não faz sentido: qual dos nomes do grupo havia de aparecer?</li>
<li><code>WHERE</code> filtra <strong>linhas</strong>, antes de agrupar. <code>HAVING</code> filtra <strong>grupos</strong>, depois de agrupar, e por isso já pode usar funções: <code>HAVING COUNT(*) &gt;= 2</code>.</li>
<li>Se a ordem dos grupos interessa, junta <code>ORDER BY</code>.</li>
</ul>
<p>A ordem de trabalho completa: <code>FROM</code> → <code>WHERE</code> → <code>GROUP BY</code> → <code>HAVING</code> → <code>SELECT</code> → <code>ORDER BY</code> → <code>LIMIT</code>.</p>`,
  analogy: H`O <code>GROUP BY</code> é separar os testes em montes, um por curso, e depois contar ou fazer a média de cada monte. O <code>WHERE</code> tira testes antes de fazer os montes; o <code>HAVING</code> deita fora montes inteiros depois de feitos.`,

      { l: 1, g: { label: 'SELECT curso, COUNT(*), AVG(nota)', cols: ['curso', 'n', 'media'], rows: [['LEE', 2, 10.5], ['LEI', 4, 13.25], ['LEM', 2, 14.5]] }, n: 'Cada grupo dá uma linha. LEE: (14 + 7) / 2 = 10.5. LEI: 53 / 4 = 13.25. LEM: (18 + 11) / 2 = 14.5.' },

  title: 'Chaves e relações',
  short: 'chave primária, chave estrangeira, 1:N e N:M',
  body: H`
<p>Uma base de dados a sério tem várias tabelas ligadas entre si. As ligações fazem-se com chaves.</p>
<ul>
<li>A <strong>chave primária</strong> (PK) identifica cada linha: não se repete e não pode ser NULL. Pode ser uma coluna (<code>numero</code>) ou um par de colunas (<code>PRIMARY KEY (aluno, uc)</code>).</li>
<li>Uma <strong>chave estrangeira</strong> (FK) é uma coluna que guarda a chave primária de uma linha <em>de outra tabela</em>: <code>curso TEXT REFERENCES cursos(sigla)</code>. É assim que o aluno "aponta" para o seu curso. Lembras-te dos apontadores em C? A ideia é parecida: em vez da morada, guarda-se a chave.</li>
<li>O SGBD não deixa a FK apontar para o vazio: inserir um aluno num curso que não existe, ou apagar um curso que ainda tem alunos, dá <em>FOREIGN KEY constraint failed</em>. <strong>No SQLite</strong> esta verificação vem desligada; liga-se com <code>PRAGMA foreign_keys = ON;</code>.</li>
</ul>
<p>Num <strong>diagrama ER</strong> (entidade-relação), cada entidade (Curso, Aluno, UC) vira uma tabela e as relações dizem como se ligam:</p>
<table class="t">
<thead><tr><th>Relação</th><th>Exemplo</th><th>Como fica nas tabelas</th></tr></thead>
<tbody>
<tr><td>1:N (um para muitos)</td><td>um curso tem muitos alunos; cada aluno tem um curso</td><td>uma FK do lado N: <code>alunos.curso</code></td></tr>
<tr><td>N:M (muitos para muitos)</td><td>um aluno tem muitas UCs; uma UC tem muitos alunos</td><td>uma tabela de ligação com as duas FK: <code>inscricoes(aluno, uc)</code>, que pode guardar dados da relação (a <code>nota</code>)</td></tr>
</tbody>
</table>`,

  examples: [{
    title: 'A chave estrangeira a proteger os dados',

// O JOIN de alunos com cursos: cada aluno junto com a linha do seu curso.
const cursoDe = sigla => ESCOLA.cursos.rows.find(c => c[0] === sigla);
const alunoComCurso = ESCOLA.alunos.rows.map(a => a.concat(cursoDe(a[2])));
const JOIN_COLS = ['a.numero', 'a.nome', 'a.curso', 'c.sigla', 'c.nome'];
const nomeECurso = alunoComCurso.map(r => [r[1], r[4]]);
// O LEFT JOIN de alunos com inscricoes: uma linha por inscrição, e NULL para quem não tem nenhuma.
const LEFT_COLS = ['a.numero', 'a.nome', 'a.curso', 'i.aluno', 'i.uc', 'i.nota'];
const alunoComInscricoes = ESCOLA.alunos.rows.flatMap(a => {
  const mine = ESCOLA.inscricoes.rows.filter(i => i[0] === a[0]);
  return mine.length ? mine.map(i => a.concat(i)) : [a.concat([null, null, null])];
});
